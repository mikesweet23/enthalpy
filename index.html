<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08131F">
<title>Room First · air &amp; plant selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#08131F; --panel:#0E1E2E; --panel2:#12273A; --line:#1B3348; --line2:#2A4F72;
  --ink:#E6EEF6; --ink2:#B9CBDD; --muted:#7E97AE;
  --brand:#2E90FF; --cyan:#2E90FF; --cool:#5FC8F5; --amber:#F2A03F; --blue:#5FC8F5; --violet:#A98BFF;
  --ok:#4ED08A; --warn:#F5C44B; --bad:#FF6B6B;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--body);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:96px;
}
h1,h2,h3,h4{font-family:var(--cond); font-weight:700; margin:0; letter-spacing:.01em}
a{color:var(--cyan)}

/* ---------- shell ---------- */
header.top{
  position:sticky; top:0; z-index:40; background:rgba(8,19,31,.94);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.topin{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center}
.brand{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--cyan)}
.jobname{
  flex:1;min-width:60px;background:transparent;border:0;border-bottom:1px dashed var(--line2);
  color:var(--ink);font-family:var(--cond);font-size:15px;padding:3px 2px;
}
.jobname:focus{outline:none;border-bottom-color:var(--cyan)}
.tbtn{
  background:var(--panel);border:1px solid var(--line2);color:var(--ink2);
  font-family:var(--cond);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap
}
.tbtn:hover{border-color:var(--cyan);color:var(--cyan)}
.modesw{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.modesw button{background:transparent;border:0;border-right:1px solid var(--line2);color:var(--ink2);
  font-family:var(--cond);font-size:12.5px;letter-spacing:.03em;padding:7px 12px;cursor:pointer;white-space:nowrap}
.modesw button:last-child{border-right:0}
.modesw button[aria-pressed=true]{background:var(--brand);color:#04121F;font-weight:700}
.modesw button[data-m=site][aria-pressed=true]{background:var(--amber)}
.sl{display:flex;align-items:center;gap:12px;padding:9px 0}
.sl label{flex:0 0 108px;font-size:13px;color:var(--ink2)}
.sl input[type=range]{flex:1;accent-color:var(--brand);height:26px;background:transparent}
.sl .rv{font-family:var(--mono);font-size:15px;font-weight:600;width:80px;text-align:right}
.senseg{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--line);margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.senseg>div{background:var(--panel);padding:9px 11px}
.senseg .k{font-family:var(--cond);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.senseg .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px}

.wrap{max-width:1400px;margin:0 auto;padding:16px}
@media(min-width:1080px){
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .rightcol{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow-y:auto;padding-right:4px}
}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.svcard{border-color:#5A4520;background:linear-gradient(180deg,#17202B,#0E1E2E)}
.svcard>summary .step{color:var(--amber);border-color:#5A4520}
.card>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:baseline;gap:10px}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:'+';margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:17px}
.card[open]>summary::after{content:'–'}
.card[open]>summary{border-bottom:1px solid var(--line)}
.step{font-family:var(--mono);font-size:11px;color:var(--cyan);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
.card h2{font-size:17px}
.sub{font-size:12px;color:var(--muted);font-family:var(--cond);letter-spacing:.03em}
.cbody{padding:12px 15px 16px}

/* ---------- fields ---------- */
.field{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(27,51,72,.5)}
.field:last-child{border-bottom:0}
.field label{flex:1;font-size:13.5px;color:var(--ink2)}
.field .u{font-family:var(--mono);font-size:11px;color:var(--muted);width:44px;text-align:left}
input[type=number],input[type=text],select{
  background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  font-family:var(--mono);font-size:14px;padding:6px 8px;border-radius:6px;width:96px;text-align:right;
}
select{width:auto;max-width:190px;text-align:left;font-family:var(--body);font-size:13px}
input:focus,select:focus{outline:2px solid var(--cyan);outline-offset:-1px}
input:disabled{opacity:.35}
.hint{font-size:11.5px;color:var(--muted);padding:2px 0 8px;line-height:1.4}
.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--line2);color:var(--ink2);
  font-family:var(--cond);font-size:12.5px;padding:7px 11px;cursor:pointer
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--cyan);color:#04121F;font-weight:700}
.grp{margin:10px 0 4px;font-family:var(--cond);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- results ---------- */
.rescard{background:linear-gradient(180deg,#10263A,#0C1B29);border:1px solid var(--line2)}
.big{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line)}
.kpi>div{background:var(--panel);padding:11px 12px}
.kpi .k{font-family:var(--cond);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:2px}
.kpi .n{font-size:11px;color:var(--muted);margin-top:1px}

/* ladder — signature element */
.ladder{padding:4px 0 2px}
.lrow{display:grid;grid-template-columns:112px 1fr 78px;align-items:center;gap:9px;padding:4px 0}
.lname{font-family:var(--cond);font-size:12.5px;color:var(--ink2);text-align:right;letter-spacing:.02em}
.ltrack{height:16px;background:#0B1A28;border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.lfill{position:absolute;left:0;top:0;bottom:0;background:#1C3550;transition:width .35s cubic-bezier(.2,.7,.3,1)}
.lrow.win .lfill{background:linear-gradient(90deg,#1E5FA8,var(--cyan))}
.lrow.win .lname{color:var(--cyan);font-weight:700}
.lval{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right}
.lrow.win .lval{color:var(--ink)}
.lrow.na .ltrack{opacity:.35}
.lrow.short .lfill{background:linear-gradient(90deg,#7A2733,#FF6B6B)}
.lrow.short .lname{color:var(--bad)}
.lrow.sel .lfill{background:linear-gradient(90deg,#2A5A8C,#E6EEF6)}
.lrow.sel .lname{color:var(--ink);font-weight:700}
.lmark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.driver{
  margin-top:10px;padding:10px 12px;border-left:3px solid var(--cyan);background:rgba(46,144,255,.07);
  font-size:13.5px;border-radius:0 7px 7px 0
}
.driver b{color:var(--cyan)}

table.st{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
table.st th{font-family:var(--cond);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:5px 4px;border-bottom:1px solid var(--line2);font-weight:600}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st td{padding:5px 4px;border-bottom:1px solid rgba(27,51,72,.6);text-align:right;white-space:nowrap}
table.st td:first-child{font-family:var(--body);font-size:12.5px;color:var(--ink2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.chk{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid rgba(27,51,72,.6);font-size:13px;align-items:flex-start}
.chk:last-child{border-bottom:0}
.chk .ic{font-family:var(--mono);font-size:12px;font-weight:600;min-width:16px}
.chk .tx b{font-family:var(--cond);letter-spacing:.02em}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--muted)}
.pill{display:inline-block;font-family:var(--cond);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid currentColor;margin-left:6px}

/* sticky bottom bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(9,20,32,.97);
  border-top:1px solid var(--line2);backdrop-filter:blur(10px);
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));
}
.barin{max-width:1400px;margin:0 auto;display:flex;gap:14px;align-items:center;overflow-x:auto}
.bcell{flex:0 0 auto}
.bcell .k{font-family:var(--cond);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.bcell .v{font-family:var(--mono);font-size:16px;font-weight:600}
.bstat{margin-left:auto;flex:0 0 auto}

svg{display:block;width:100%;height:auto}
.schem{overflow-x:auto;-webkit-overflow-scrolling:touch}
.schem svg{min-width:720px}
.zoomrow{display:flex;align-items:center;gap:6px;padding:0 4px 8px;font-family:var(--cond);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.zoomrow button{background:var(--panel2);border:1px solid var(--line2);color:var(--ink2);font-family:var(--cond);font-size:11.5px;padding:4px 10px;border-radius:5px;cursor:pointer}
.zoomrow button[aria-pressed=true]{background:var(--brand);color:#04121F;font-weight:700;border-color:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);padding-top:8px;font-family:var(--cond)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px}
.foot{max-width:1400px;margin:0 auto;padding:6px 16px 20px;font-size:11.5px;color:var(--muted)}

@media print{
  body{background:#fff;color:#000;padding:0}
  header.top,.bar,.card:not([open]) .cbody{display:none}
  .card{break-inside:avoid;border-color:#999}
  .wrap{display:block;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand">Room<span>First</span></div>
  <input class="jobname" id="jobName" placeholder="Project / room reference" value="">
  <div class="modesw" id="modesw">
    <button data-m="design" aria-pressed="true" onclick="setMode('design')">Design</button>
    <button data-m="site" aria-pressed="false" onclick="setMode('site')">Site check</button>
    <button data-m="sense" aria-pressed="false" onclick="setMode('sense')">Sense check</button>
  </div>
  <button class="tbtn" onclick="saveFile()">Save</button>
  <button class="tbtn" onclick="document.getElementById('loadFile').click()">Open</button>
  <button class="tbtn" onclick="window.print()">Print</button>
  <input type="file" id="loadFile" accept=".json" style="display:none" onchange="loadFile(event)">
</div></header>

<div class="wrap">
  <div class="leftcol" id="leftcol"></div>
  <div class="rightcol" id="rightcol"></div>
</div>
<div class="foot" id="foot"></div>

<div class="bar"><div class="barin" id="barin"></div></div>
<script>
/*CORE-START*/
const RD=287.055, RATIO=0.621945;
function psatPa(t){const T=t+273.15;
  if(t>=0){const C8=-5800.2206,C9=1.3914993,C10=-0.048640239,C11=4.1764768e-5,C12=-1.4452093e-8,C13=6.5459673;
    return Math.exp(C8/T+C9+C10*T+C11*T*T+C12*T*T*T+C13*Math.log(T));}
  const C1=-5674.5359,C2=6.3925247,C3=-0.009677843,C4=6.2215701e-7,C5=2.0747825e-9,C6=-9.484024e-13,C7=4.1635019;
  return Math.exp(C1/T+C2+C3*T+C4*T*T+C5*T*T*T+C6*Math.pow(T,4)+C7*Math.log(T));}
function Wsat(t,P){const pw=psatPa(t)/1000; if(pw>=P*0.999) return 10; return RATIO*pw/(P-pw);}
function WfromRH(t,rh,P){const pw=rh*psatPa(t)/1000; return RATIO*pw/(P-pw);}
function RHfromW(t,W,P){const pw=P*W/(RATIO+W), ps=psatPa(t)/1000; return pw/ps;}
function enth(t,W){return 1.006*t+W*(2501+1.86*t);}
function tFromH(h,W){return (h-2501*W)/(1.006+1.86*W);}
function dewpoint(W,P){const pw=P*Math.max(W,1e-7)/(RATIO+Math.max(W,1e-7));
  let lo=-80,hi=99; for(let i=0;i<70;i++){const m=(lo+hi)/2; if(psatPa(m)/1000<pw) lo=m; else hi=m;} return (lo+hi)/2;}
function wetbulb(t,W,P){let lo=-80,hi=t;
  for(let i=0;i<70;i++){const m=(lo+hi)/2,Ws=Wsat(m,P);
    const Wc=((2501-2.326*m)*Ws-1.006*(t-m))/(2501+1.86*t-4.186*m);
    if(Wc>W) hi=m; else lo=m;} return (lo+hi)/2;}
function volSpec(t,W,P){return RD*(t+273.15)*(1+1.607858*W)/(P*1000);}
function st(t,W,P){return{t:t,W:W,h:enth(t,W),rh:RHfromW(t,W,P),dp:dewpoint(W,P),wb:wetbulb(t,W,P),v:volSpec(t,W,P)};}

const ACT={
 seated:{n:'Seated, at rest / desk',s:70,l:0.045},
 light:{n:'Light office work',s:75,l:0.055},
 standing:{n:'Standing, light work',s:80,l:0.085},
 walking:{n:'Walking / moving about',s:100,l:0.105},
 moderate:{n:'Moderate factory work',s:130,l:0.200},
 heavy:{n:'Heavy work',s:190,l:0.367}
};
const LEAK={sealed:{n:'Sealed (cleanroom, new sealed shell)',r:0.5},tight:{n:'Tight (good modern construction)',r:1.5},
 avg:{n:'Average (typical industrial build)',r:3.5},leaky:{n:'Leaky (older shell, many penetrations)',r:8.0}};
function fluid(g){ // glycol % ethylene
  const f=g/100; return {cp:4.18-1.1*f, rho:1000+140*f};}

function solve(S){
  const P=S.pressure, R={warnings:[]};
  const V=Math.max(1,S.roomArea*S.roomHeight);
  const act=ACT[S.occAct]||ACT.seated;
  const occSens=S.occ*act.s/1000, occLat=S.occ*act.l;
  let qs = (S.sensMode==='total') ? S.qsTotal
        : occSens + S.lighting*S.roomArea/1000 + S.equip + S.solar + S.otherSens;
  qs=Math.max(0.001,qs);
  const latKgh=Math.max(0,occLat+S.procLatent);
  const hfgR=2501+1.86*S.roomT;
  const ql=latKgh/3600*hfgR;
  const W_r=WfromRH(S.roomT,S.roomRH/100,P), h_r=enth(S.roomT,W_r);
  const W_hi=WfromRH(S.roomT,Math.min(0.98,(S.roomRH+S.tolRH)/100),P);
  const W_lo=WfromRH(S.roomT,Math.max(0.02,(S.roomRH-S.tolRH)/100),P);
  const Wdeh=S.rhMode==='setpoint'?W_r:W_hi;
  const Whum=S.rhMode==='setpoint'?W_r:W_lo;
  const bal_exh=f=>S.exhMode==='bal'?Math.max(0,(S.freshMode==='pct'?S.freshPct/100*f:0)-S.extract):0;
  const room=st(S.roomT,W_r,P);
  const OA=st(S.osDB,WfromRH(S.osDB,S.osRH/100,P),P);

  const coolBase = S.coolSrc==='dx' ? S.evapT : S.chwF;
  const coolApp  = S.coolSrc==='dx' ? S.dxApproach : S.approach;
  let fanRise = S.fanMode==='sfp' ? S.sfp*(S.motorInAir?1:0.85)/1.207 : S.fanMode==='k' ? S.fanK : 0.8;
  const fanRiseFor=(m,W)=> S.fanMode==='kw' ? S.fanHeatKW/Math.max(0.02,m*(1.006+1.86*W)) : fanRise;

  // fixed airflow requirements (l/s)
  const leakA=Math.max(1e-5,S.envArea*(LEAK[S.leakClass]||LEAK.avg).r/10000);
  const recover=(src,exh_ls,fa_ls)=>{
    if(S.hrType==='none'||exh_ls<=0||fa_ls<=0) return {s:src,ratio:0};
    const ratio=Math.min(1,exh_ls/fa_ls);
    const es=S.hrEffS/100*ratio, el=(S.hrType==='wheel'?S.hrEffL/100:0)*ratio;
    return {s:st(src.t+es*(S.roomT-src.t), src.W+el*(W_r-src.W), P), ratio:ratio};
  };
  const exhaustOf=f=>S.exhMode==='pct'?S.exhPct/100*f:S.exhMode==='lps'?S.exhFixed:Math.max(0,(S.freshMode==='pct'?S.freshPct/100*f:0)-S.extract);
  const leak_ls = S.pressMode==='leak' ? 0.827*leakA*Math.sqrt(Math.max(0,S.pressDP))*1000
                 : S.pressMode==='ach' ? S.pressACH*V/3.6 : 0;
  const press_ls = (S.pressMode==='none') ? S.extract : S.extract+leak_ls;
  const minach_ls = S.minACH*V/3.6;
  const freshBase = S.freshMode==='perp' ? S.occ*S.freshPerP
                  : S.freshMode==='ach'  ? S.freshACH*V/3.6
                  : S.freshMode==='fixed'? S.freshFixed : 0;

  // iterate
  let flow=Math.max(freshBase,press_ls,minach_ls,50);
  let ts=S.roomT-8, Ws=Math.max(0.0005,W_r-0.002);
  let cand={},E={},m_oa=0,mda=0,oa_ls=0,latImposs=false,exh_ls=0,FA={ratio:0},FAs=OA;
  for(let i=0;i<150;i++){
    const vs=(S.flowRef==='return')?volSpec(S.roomT,W_r,P):volSpec(ts,Ws,P);
    mda=flow/1000/vs;
    oa_ls = S.freshMode==='pct' ? Math.min(flow,S.freshPct/100*flow) : Math.min(flow,freshBase);
    exh_ls=S.exhMode==='bal'?Math.max(0,oa_ls-S.extract):exhaustOf(flow);
    FA=recover(OA,exh_ls,oa_ls); FAs=FA.s;
    m_oa=oa_ls/1000/FAs.v;
    const m_ra=Math.max(0,mda-m_oa);
    const W_E=(m_oa*FAs.W+m_ra*W_r)/mda, h_E=(m_oa*FAs.h+m_ra*h_r)/mda;
    E=st(tFromH(h_E,W_E),W_E,P);
    const adpMin=coolBase+coolApp, WadpMin=Wsat(adpMin,P);
    const WoffMin = WadpMin>=E.W ? E.W : E.W-S.CF*(E.W-WadpMin);
    R.WoffMin=WoffMin;
    const cpm=1.006+1.86*E.W;
    const m_sens=qs/(cpm*Math.max(0.5,S.dtMax));
    let m_lat=Infinity; latImposs=true;
    if(Wdeh-WoffMin>1e-6 && latKgh>0){m_lat=(latKgh/3600)/(Wdeh-WoffMin); latImposs=false;}
    if(latKgh<=0){m_lat=0; latImposs=false;}
    cand={sensible:m_sens*vs*1000, latent:isFinite(m_lat)?m_lat*vs*1000:NaN,
          fresh:oa_ls, pressure:press_ls, minach:minach_ls};
    const vals=Object.values(cand).filter(v=>isFinite(v));
    let nf=Math.max(...vals,50);
    if(latImposs) nf=Math.max(nf, cand.sensible||0);
    if(i>=100 && S.flowMode==='fixed') flow=Math.max(20,S.flowFixed);
    else flow=flow+(nf-flow)*0.6;
    const mda2=flow/1000/vs;
    ts=S.roomT-qs/(mda2*(1.006+1.86*Ws));
    Ws=Math.max(0.0002,Wdeh-(latKgh/3600)/mda2);
  }
  flow=Math.round(flow*10)/10;
  const vs=(S.flowRef==='return')?volSpec(S.roomT,W_r,P):volSpec(ts,Ws,P); mda=flow/1000/vs;
  const supplyReq=st(ts,Ws,P);
  let driver='sensible',best=-1;
  for(const k in cand){if(isFinite(cand[k])&&cand[k]>best){best=cand[k];driver=k;}}
  if(latImposs) driver='latent-impossible';

  fanRise=fanRiseFor(mda,E.W);
  // ---- coil ----
  const CF=S.CF, adpMin=coolBase+coolApp;
  const t_off_T=ts-fanRise;
  const adpReq_T=E.t-(E.t-t_off_T)/CF;
  let adpReq_M=null;
  if(Ws<E.W-1e-6){const W_ADP_M=E.W-(E.W-Ws)/CF; adpReq_M = W_ADP_M>1e-4 ? dewpoint(W_ADP_M,P) : -60;}
  let adp = adpReq_M!==null ? Math.min(adpReq_T,adpReq_M) : adpReq_T;
  const govern = (adpReq_M!==null && adpReq_M<adpReq_T-0.02) ? 'moisture' : 'temperature';
  let adpOK=true;
  if(adp<adpMin-0.02){adpOK=false; adp=adpMin;}
  const wet = adp<E.dp-0.02;
  const t_off = E.t-CF*(E.t-adp);
  const W_off = wet ? Math.max(0.0002,E.W-CF*(E.W-Wsat(adp,P))) : E.W;
  const t_ADP=adp, W_ADP=Wsat(adp,P);
  const off=st(t_off,W_off,P);
  const t_sup_nore=t_off+fanRise;
  let reheat=0;
  if(S.reheatSrc!=='none' && t_sup_nore < ts-0.05) reheat=mda*(1.006+1.86*W_off)*(ts-t_sup_nore);
  const t_supply = reheat>0 ? ts : t_sup_nore;
  const supply=st(t_supply,W_off,P);
  const mode = wet ? (govern==='moisture'?'Dehumidification governs':'Cooling governs, coil runs wet') : 'Dry coil';
  const cpm=1.006+1.86*E.W;
  const t_roomAct=supply.t+qs/(mda*(1.006+1.86*supply.W));
  const W_roomAct=supply.W+latKgh/3600/mda;
  const roomAct=st(t_roomAct,W_roomAct,P);

  const cond=Math.max(0,mda*(E.W-W_off));
  const total=Math.max(0,mda*(E.h-off.h)-cond*4.186*Math.max(t_off,0));
  const sens=mda*cpm*(E.t-t_off);
  const lat=Math.max(0,total-sens);
  const fanKW=S.fanMode==='kw'?S.fanHeatKW:mda*(1.006+1.86*W_off)*fanRise;
  const netCool=Math.max(0,total-fanKW);
  const oaLoad=m_oa*(FAs.h-h_r);
  const hrSaved=Math.abs(m_oa*(OA.h-FAs.h));
  const leakOut=oa_ls-exh_ls-S.extract;
  const roomPa=Math.sign(leakOut)*Math.pow(Math.abs(leakOut)/1000/(0.827*leakA),2);
  const fl=fluid(S.glycol);
  const chwFlow = S.coolSrc==='chw' ? total/(fl.cp*fl.rho/1000*Math.max(0.5,S.chwR-S.chwF)) : 0;
  const dxAbs   = S.coolSrc==='dx' ? total/Math.max(1,S.dxEER) : 0;
  const lphwFlow=(S.reheatSrc==='lphw')?reheat/(4.18*Math.max(1,S.lphwF-S.lphwR)):0;
  const reheatFree = (S.reheatSrc==='recover'||S.reheatSrc==='hotgas');
  const reheatElec = S.reheatSrc==='elec' ? reheat : 0;
  const faceArea=flow/1000/Math.max(0.5,S.faceVel);
  const ROWS=[[0.60,2],[0.72,3],[0.82,4],[0.88,5],[0.93,6],[0.96,8],[0.985,10]];
  let rows=10; for(const r of ROWS){if(CF<=r[0]){rows=r[1];break;}}

  // ---- winter ----
  const OW=st(S.owDB,WfromRH(S.owDB,S.owRH/100,P),P);
  const vs_w=volSpec(S.roomT,W_r,P), mda_w=flow/1000/vs_w;
  const FAw=recover(OW,exh_ls,oa_ls).s;
  const m_oa_w=oa_ls/1000/FAw.v, m_ra_w=Math.max(0,mda_w-m_oa_w);
  const W_Ew=(m_oa_w*FAw.W+m_ra_w*W_r)/mda_w, h_Ew=(m_oa_w*FAw.h+m_ra_w*h_r)/mda_w;
  const Ew=st(tFromH(h_Ew,W_Ew),W_Ew,P);
  const qNet=S.winterLoss-S.winterGains;
  const cpw=1.006+1.86*W_Ew;
  const fanRiseW=fanRiseFor(mda_w,W_Ew);
  const ts_w=S.roomT+qNet/(mda_w*cpw);
  const dtHeat=ts_w-S.roomT;
  const heatShort=dtHeat>S.dtHeatMax ? mda_w*cpw*(dtHeat-S.dtHeatMax) : 0;
  const ts_w_cap=Math.min(ts_w,S.roomT+S.dtHeatMax);
  const W_sup_w=Math.max(0,Whum-latKgh/3600/mda_w);
  const humKgh=W_sup_w>W_Ew ? mda_w*(W_sup_w-W_Ew)*3600 : 0;
  const t_coilOut_w=ts_w_cap-fanRiseW;
  let heater=0,preheatAdb=0,humkW=0;
  if(S.humid==='steam'||humKgh<=0){
    heater=Math.max(0,mda_w*cpw*(t_coilOut_w-Ew.t));
    humkW=humKgh*2675/3600;
  } else {
    const hFin=enth(t_coilOut_w,W_sup_w);
    const tPre=tFromH(hFin,W_Ew);
    preheatAdb=tPre;
    heater=Math.max(0,mda_w*(enth(tPre,W_Ew)-Ew.h));
    humkW=0;
  }
  const lphwHeatFlow=(S.heatSrc==='lphw')?heater/(4.18*Math.max(1,S.lphwF-S.lphwR)):0;
  const heatElec = S.heatSrc==='elec' ? heater : 0;
  const hpAbs    = S.heatSrc==='hp' ? heater/Math.max(1,S.hpCOP) : 0;
  const elecTotal = reheatElec + heatElec + dxAbs + hpAbs;
  const amps = k=>k*1000/(Math.sqrt(3)*400);
  // fixed-airflow shortfalls
  const shortfall={};
  if(S.flowMode==='fixed'){for(const k in cand){if(isFinite(cand[k])&&cand[k]>flow*1.005) shortfall[k]=cand[k];}}

  // ---- shoulder ----
  const SH=st(S.shDB,WfromRH(S.shDB,S.shRH/100,P),P);
  const FAsh=recover(SH,exh_ls,oa_ls).s;
  const m_oa_s=oa_ls/1000/FAsh.v, mda_s=mda, m_ra_s=Math.max(0,mda_s-m_oa_s);
  const W_Es=(m_oa_s*FAsh.W+m_ra_s*W_r)/mda_s, h_Es=(m_oa_s*FAsh.h+m_ra_s*h_r)/mda_s;
  const Es=st(tFromH(h_Es,W_Es),W_Es,P);
  const qs_s=qs*S.shLoad/100;
  const ts_s=S.roomT-qs_s/(mda_s*(1.006+1.86*W_Es));
  const toff_s=ts_s-fanRiseFor(mda_s,W_Es);
  let W_off_s;
  if(toff_s>=Es.dp) W_off_s=Es.W;
  else{let tadp_s=Es.t-(Es.t-toff_s)/CF; tadp_s=Math.max(tadp_s,adpMin);
       W_off_s=Es.W-CF*(Es.W-Wsat(tadp_s,P));}
  const W_room_s=W_off_s+latKgh/3600/mda_s;
  const shRHroom=RHfromW(S.roomT,W_room_s,P)*100;

  return {V,qs,ql,latKgh,WoffMin:R.WoffMin,occSens,occLat,room,OA,OW,SH,E,Es,Ew,off,supply,supplyReq,roomAct,
    flow,mda,oa_ls,cand,driver,latImposs,fanRise,wet,mode,govern,t_ADP,W_ADP,adpOK,adpMin,adpReq_T,adpReq_M,
    total,sens,lat,cond:cond*3600,reheat,oaLoad,chwFlow,lphwFlow,faceArea,rows,CF,
    fanRise,dxAbs,reheatElec,heatElec,hpAbs,elecTotal,amps,shortfall,reheatFree,adpMinSrc:coolBase,
    exh_ls,FAs,hrRatio:FA.ratio,hrSaved,fanKW,netCool,W_hi,W_lo,Wdeh,leakOut,roomPa,leakA,occSensKW:occSens,act,
    ts_w:ts_w_cap,dtHeat,heatShort,humKgh,humkW,heater,preheatAdb,lphwHeatFlow,qNet,
    shRHroom,W_room_s,leak_ls,press_ls,minach_ls,freshBase,
    ach:flow/1000*3600/V, oaPct:oa_ls/flow*100, dtSupply:S.roomT-supply.t,
    sfpCheck:S.fanMode==='sfp'?S.sfp:null};
}
/*CORE-END*/
</script>
