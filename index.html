  if(S.procLatent>0){g+=lab(374,254,'PROCESS MOISTURE',MU);g+=val(534,254,`${n(S.procLatent,1)} kg/h`,IN,12);}
  g+=`<line x1="374" y1="266" x2="690" y2="266" stroke="${C.rule}"/>`;
  g+=val(374,284,`${n(S.roomArea,0)} m² × ${n(S.roomHeight,1)} m = ${n(R.V,0)} m³ · ${n(R.ach,1)} ac/h · ${n(R.achFresh,2)} fresh`,MU,10.5);
  g+=val(374,301,(S.extract>0?`LEV ${fu(S.extract)} · `:'')+bal(R),R.leakOut<-0.5?RD:R.leakOut>0.5?BR:MU,10.5);
  if(R.leakOut>0.5) g+=lab(712,196,'OUT',BR,10);

  // AHU
  g+=box(12,356,696,116,C.ahuLine,C.ahuFill);
  g+=lab(24,374,'AIR HANDLING UNIT',MU);
  if(R.cond>0.005) g+=val(162,375,R.frosting?`frost ${mu(R.cond)} held on the coil · ${n(R.frostAcc.massKg,0)} kg in ${n(S.defrostH||8,0)} h`:`condensate ${mu(R.cond)} to drain`,R.frosting?CO:MU,10.5);
  const comp=(x,w,ttl,col,l1,l1s,l2,l3)=>{let s=box(x,384,w,80,col);
    s+=lab(x+12,402,ttl,col);
    if(l1)s+=big(x+12,426,l1,IN,l1s||19);
    if(l2)s+=val(x+12,443,l2,MU,10.5);
    if(l3)s+=val(x+12,458,l3,MU,10);
    return s;};
  g+=comp(22,132,'MIX',IN,`${n(pctF,0)}% fresh`,16,`${n(100-pctF,0)}% return air`,stl(R.E));
  g+=comp(162,152,R.frosting?(S.coolSrc==='dx'?'DX COIL · FROSTED':'COIL · FROSTED'):(S.coolSrc==='dx'?'DX COIL':'COOLING COIL'),CO,`${n(R.total,1)} kW`,19,
      `${n(R.sens,1)} sens / ${n(R.lat,1)} lat`,`off ${n(R.off.t,1)}°C ${n(R.off.rh*100,0)}% · ADP ${n(R.t_ADP,1)}°C`);
  g+=comp(324,116,'REHEAT',R.reheat>0?AM:MU,R.reheat>0?`${n(R.reheat,1)} kW`:'none',R.reheat>0?19:14,
      R.reheat>0?(S.reheatSrc==='hotgas'?'hot gas':S.reheatSrc==='recover'?'run-around':S.reheatSrc==='elec'?'electric':'LPHW'):'not required',
      R.reheat>0&&R.reheatFree?'free to run':'');
  g+=comp(450,80,'FAN',BR,`+${n(R.fanRise,1)} K`,15,S.fanMode==='sfp'?`${n(S.sfp,1)} W/l/s`:'stated','');
  g+=box(538,384,158,80,BR,C.supFill);
  g+=lab(550,402,'SUPPLY AIR',BR);
  const fs=fv(R.flow), fsz=fs.length>6?18:fs.length>5?21:24; g+=big(550,428,fs,BR,fsz); g+=val(550+fs.length*fsz*0.6+7,428,auN(),BR,12);
  g+=val(550,445,stl(R.supply),IN,11.5);
  g+=val(550,459,`${n(S.roomT-R.supply.t,1)} K below room`,MU,10);
  g+=lab(632,344,'SUPPLY',BR);
  g+=lab(310,352,'RETURN AIR AT ROOM CONDITION',MU);
  const svg=`<svg viewBox="0 0 760 484" style="min-width:${schemMinW(SCHZ)}" xmlns="http://www.w3.org/2000/svg">${forPdf?`<rect width="760" height="484" fill="${C.bg}"/>`:''}${g}</svg>`;
  if(forPdf) return svg;
  return `<div class="zoomrow"><span>Size</span>`+
    [[1,'Fit'],[1.5,'Bigger'],[2.2,'Biggest']].map(z=>`<button data-z="${z[0]}" aria-pressed="${SCHZ===z[0]}" onclick="zoomSchem(${z[0]})">${z[1]}</button>`).join('')+
    `<span class="sp" style="flex:1"></span><span>Airflow</span>${auTog()}</div><div class="schem">${svg}</div>`;
}
function bal(R){
  return Math.abs(R.leakOut)<0.5?'air balanced — supply matches extract'
    :`${fu(Math.abs(R.leakOut))} ${R.leakOut>0?'surplus — out via doors/relief':'shortfall — drawn in, provide a make-up path'}`;
}

function ladder(R){
  const keys=['sensible','latent','fresh','pressure','minach'];
  var splitNote=R.vent?`<div class="driver">Room units + ventilation is selected, so the split above governs: ${fu(R.vent.roomAir)} through the room units and ${fu(R.vent.ventFlow)} of fresh air. The bars below describe the equivalent all-air path used to work the coils — do not add the two together.</div>`:'';
  const vals=keys.map(k=>isFinite(R.cand[k])?R.cand[k]:0);
  const fixed=S.flowMode==='fixed';
  const mx=Math.max(...vals,fixed?R.flow:0,1);
  let h=`<div class="rowhead"><span class="k">Airflow in</span>${auTog()}<span class="sp"></span><span class="k">${n(R.ach,1)} ac/h total · ${n(R.achFresh,2)} ac/h fresh on ${n(R.V,0)} m³</span></div><div class="ladder">`;
  keys.forEach((k,i)=>{
    const win=!fixed&&((k===R.driver)||(R.driver==='latent-impossible'&&k==='sensible'));
    const na=!isFinite(R.cand[k])||R.cand[k]<=0;
    const shrt=fixed&&R.shortfall[k];
    h+=`<div class="lrow ${win?'win':''} ${na?'na':''} ${shrt?'short':''}"><div class="lname">${DRV[k][0]}</div>
    <div class="ltrack"><div class="lfill" style="width:${Math.min(100,vals[i]/mx*100)}%"></div>${fixed?`<div class="lmark" style="left:${Math.min(100,R.flow/mx*100)}%"></div>`:''}</div>
    <div class="lval">${k==='latent'&&R.latImposs?'∞':fu(vals[i])}</div></div>`;
  });
  if(fixed) h+=`<div class="lrow sel"><div class="lname">Unit airflow</div>
    <div class="ltrack"><div class="lfill" style="width:${Math.min(100,R.flow/mx*100)}%"></div></div>
    <div class="lval">${fu(R.flow)}</div></div>`;
  h+='</div>';
  h=splitNote+h;
  if(fixed){
    const sk=Object.keys(R.shortfall);
    if(sk.length) h+=`<div class="driver bad">
      <b class="bad">${fu(R.flow)} does not cover everything.</b> Short on ${sk.map(k=>DRV[k][0].toLowerCase()+' ('+fu(R.shortfall[k])+')').join(', ')}.
      Read the room it actually achieves below before you commit to this unit.</div>`;
    else h+=`<div class="driver"><b>${fu(R.flow)} covers every requirement.</b> The largest of them is
      ${DRV[R.driver][0].toLowerCase()} at ${fu(R.cand[R.driver]||0)}, so you have
      ${n((R.flow/(R.cand[R.driver]||1)-1)*100,0)}% in hand. That is ${n(R.ach,1)} air changes an hour on the room, of which ${n(R.achFresh,2)} ac/h is fresh air.</div>`;
    return h;
  }
  if(R.driver==='latent-impossible'){
    h+=`<div class="driver bad">
     <b class="bad">No airflow will hold this humidity.</b> With a contact factor of ${n(R.CF,2)} and
     ${SRC()} the coil bottoms out at ${n(R.WoffMin*1000,2)} g/kg — but the space can only be allowed to reach ${n(R.Wdeh*1000,2)} g/kg.
     Supply air that is wetter than the room can never dry it, so no airflow fixes this. Drop the chilled water temperature,
     buy a deeper coil (higher contact factor), or put a desiccant in front of it.</div>`;
  } else {
    h+=`<div class="driver"><b>${DRV[R.driver][0]} sets the airflow at ${fu(R.flow)}</b> — ${DRV[R.driver][1]}.
     Everything else is satisfied underneath it. That is ${n(R.ach,1)} air changes an hour on the ${n(R.V,0)} m³ room, ${n(R.oaPct,0)}% fresh air — ${fu(R.oa_ls)}, or ${n(R.achFresh,2)} fresh-air changes an hour.</div>`;
  }
  return h;
}
function ladderRows(R){
  const keys=['sensible','latent','fresh','pressure','minach'];
  return keys.map(k=>[DRV[k][0],(k==='latent'&&R.latImposs)?'no airflow can':fu(isFinite(R.cand[k])?R.cand[k]:0),
    S.flowMode!=='fixed'&&(k===R.driver||(R.driver==='latent-impossible'&&k==='sensible'))?'sets the airflow':(S.flowMode==='fixed'&&R.shortfall[k]?'not met':'')]);
}

function stateRow(nm,s,note){return `<tr><td>${nm}</td><td>${n(s.t,1)}</td><td>${n(s.rh*100,0)}</td><td>${n(s.W*1000,2)}</td><td>${n(s.h,1)}</td><td>${n(s.dp,1)}</td><td class="mut">${note||''}</td></tr>`;}

function SRC(){return S.coolSrc==='dx'
  ? `${n(S.evapT,1)}°C evaporating with a ${n(S.dxApproach,1)} K approach`
  : `${n(S.chwF,1)}°C water with a ${n(S.approach,1)} K approach`;}
function checks(R){
  const C=[];
  const push=(lv,t,x)=>C.push({lv,t,x});
  const frostSrcTxt=()=>S.frostSrc==='lphw'?'on hot water ('+wu(R.frostFlow)+' at '+n(S.lphwF,0)+'/'+n(S.lphwR,0)+'°C)':S.frostSrc==='elec'?'electric (about '+n(R.amps(R.frostDutyEff),0)+' A at 400 V)':'DX — confirm the selection with the manufacturer';
  /* Traceability first: example inputs and unconfirmed weather cap the whole
     assessment, however good the numbers look. */
  if(S.projectKind==='example') push('warn','Example project — inputs are not confirmed',
    'This page opened with illustrative inputs. Nothing is assessed until the room, loads, weather and arrangement are your own. Set the project to your own under Room to clear this.');
  if(S.confirmedLocation!=='yes') push('warn','Design weather is not confirmed',
    'Weather presets are indicative starting points (CIBSE Guide A style design years). Confirm them against current CIBSE Guide A / TRY-DSY data for the site before treating any result as assessed.');
  if(S.flowMode==='fixed'){
    const sk=Object.keys(R.shortfall);
    if(sk.length) push('bad','The unit airflow does not meet every requirement',
      sk.map(k=>DRV[k][0]+' needs '+fu(R.shortfall[k])).join('; ')+`. You have ${fu(R.flow)}.`);
    else push('ok','The unit airflow covers the requirement',
      `${fu(R.flow)} against a largest requirement of ${fu(R.cand[R.driver]||0)}.`);
    if(R.shortfall.sensible) push('warn','Supply air must go colder than your limit',
      `To carry ${n(R.qs,1)} kW on ${fu(R.flow)} the supply has to be ${n(R.dtSupply,1)} K below room, against the ${n(S.dtMax,1)} K you set.`);
    if(R.shortfall.fresh) push('bad','Fresh air is below the ventilation requirement',
      `${fu(R.oa_ls)} available against ${fu(R.shortfall.fresh)} needed. That is a Building Regs and an occupant issue, not a comfort one.`);
    if(R.shortfall.pressure) push('bad','The room will not hold pressure',
      `Extract and leakage need ${fu(R.shortfall.pressure)}. The room will go negative and pull dirty air in.`);
    /* Rated airflow is only half the check: compare duties against rated capacities. */
    if(S.capCheck==='yes'&&S.capCool>0){
      if(S.capCool+1e-6>=R.total) push('ok','Rated cooling capacity covers the duty',`${n(S.capCool,1)} kW rated against ${n(R.total,1)} kW required gross at the coil${S.capNote?` (${S.capNote})`:''}.`);
      else push('bad','Rated cooling capacity is short',`${n(S.capCool,1)} kW rated against ${n(R.total,1)} kW required — short by ${n(R.total-S.capCool,1)} kW at these conditions${S.capNote?` (${S.capNote})`:''}.`);
    } else push('na','Equipment cooling capacity not verified',
      `The coil needs ${n(R.total,1)} kW gross (${n(R.netCool,1)} kW net). No rated capacity at these operating conditions has been entered, so capacity is not assessed — airflow cover alone does not verify it.`);
    if(S.capCheck==='yes'&&S.capHeat>0){
      if(S.capHeat+1e-6>=R.heater) push('ok','Rated heating capacity covers the duty',`${n(S.capHeat,1)} kW rated against ${n(R.heater,1)} kW required${S.capNote?` (${S.capNote})`:''}.`);
      else push('bad','Rated heating capacity is short',`${n(S.capHeat,1)} kW rated against ${n(R.heater,1)} kW required — short by ${n(R.heater-S.capHeat,1)} kW${S.capNote?` (${S.capNote})`:''}.`);
    } else if(R.heater>0.05) push('na','Equipment heating capacity not verified',
      `Winter needs ${n(R.heater,1)} kW from the heater battery. No rated capacity has been entered, so it is not assessed.`);
  }
  if(R.driver==='latent-impossible') push('bad','Humidity target unreachable','The selection below will not hold the space. Fix the moisture path before quoting anything.');
  if(!R.adpOK){
    const req=Math.min(R.adpReq_T,R.adpReq_M===null?99:R.adpReq_M);
    push('bad','Coil cannot reach the apparatus dew point', req<-20
      ? `The moisture asked of this coil is off the scale — ${SRC()} bottoms out at an ADP of ${n(R.adpMin,1)}°C and ${n(R.WoffMin*1000,2)} g/kg off the coil. This duty needs a colder coil or desiccant.`
      : `You need an ADP of ${n(req,1)}°C but ${SRC()} bottoms out at ${n(R.adpMin,1)}°C. ${S.coolSrc==='dx'?'Drop the evaporating temperature':'Lower the flow temperature'}, deepen the coil, or accept the room drifting.`);}
  else push('ok','Apparatus dew point is achievable',
    `ADP ${n(R.t_ADP,1)}°C against ${SRC()} — ${n(R.t_ADP-R.adpMinSrc,1)} K in hand. ${R.mode}.`);

  const HM=humidityModeOf(S);
  const dT=Math.abs(R.roomAct.t-S.roomT), dRH=Math.abs(R.roomAct.rh*100-S.roomRH);
  const rhTol=HM==='close'?Math.max(0.5,S.humCloseTol):S.tolRH;
  const rhBandTxt=HM==='close'?`±${n(S.humCloseTol,1)}% RH close control`:`${n(Math.max(2,S.roomRH-S.tolRH),0)}–${n(Math.min(98,S.roomRH+S.tolRH),0)}% RH band`;
  if(R.roomAct.rh*100>100) push('bad','Room would run saturated','Condensation on surfaces. This is not a selection, it is a callback.');
  else if(HM==='none') push('na','Humidity is reported, not assessed',
    `No humidity requirement is set. The room floats to about ${n(R.roomAct.t,1)}°C / ${n(Math.min(R.roomAct.rh*100,100),0)}% RH and the coil still removes ${mu(R.cond)} — moisture, condensation and equipment loads are all calculated, only the pass/fail is skipped.`);
  else if(dT<=S.tolT&&dRH<=rhTol) push('ok',HM==='close'?'Room holds inside the close-control tolerance':'Room holds inside the permitted band',
    `${n(R.roomAct.t,1)}°C / ${n(R.roomAct.rh*100,0)}% RH achieved against ${n(S.roomT,1)}°C ±${n(S.tolT,1)} K and ${rhBandTxt}. Assumed controls can modulate the coil${R.reheat>0?' and reheat':''} to track the load — close control still depends on real sensors, valves and part-load behaviour, which this steady-state point cannot prove.`);
  else push('bad',HM==='close'?'Room does not hold the close-control tolerance':'Room sits outside the permitted band',
    `Achieved ${n(R.roomAct.t,1)}°C / ${n(R.roomAct.rh*100,0)}% RH against ${n(S.roomT,1)}°C / ${n(S.roomRH,0)}% RH (${rhBandTxt}). Off by ${n(dT,1)} K and ${n(dRH,1)}% RH. The calculation, the control requirement and this result now use the same tolerance — a green result is only given inside it.`);

  if(R.alt){
    const a=R.alt;
    if(HM==='band') push('ok','Humidity is held inside the band, not pinned to a setpoint',
      `The coil dries only enough to keep the room at or under ${n(S.roomRH+S.tolRH,0)}% RH, and it settles at ${n(Math.min(R.roomAct.rh*100,100),0)}%. Aiming at ${n(S.roomRH,0)}% RH itself would need ${n(a.total,1)} kW of cooling and ${n(a.reheat,1)} kW of reheat instead of ${n(R.total,1)} and ${n(R.reheat,1)}.`);
    else if(HM==='close') push('ok','Close control is what makes this coil deep',
      `To sit inside ±${n(S.humCloseTol,1)}% RH of ${n(S.roomRH,0)}% the coil reaches an ADP of ${n(R.t_ADP,1)}°C${R.reheat>0?` and throws ${n(R.reheat,1)} kW back in as reheat`:''}. Letting the room float inside a ±${n(S.tolRH,0)}% band would need ${n(a.total,1)} kW of cooling and ${n(a.reheat,1)} kW of reheat, settling at ${n(Math.min(a.roomAct.rh*100,100),0)}% RH. No exact real-world setpoint is promised either way.`);
  }
  push('ok','Gross and net cooling',
    `${n(R.total,1)} kW gross at the coil, ${n(R.netCool,1)} kW net into the space, the ${n(R.fanKW,1)} kW difference being the supply fan. Compare the net figure against a manufacturer's net capacity and the gross against their gross.`);
  if(R.reheat>0){
    const pct=R.reheat/R.total*100;
    if(S.reheatSrc==='recover') push('ok','Reheat is recovered, not bought',
      `${n(R.reheat,1)} kW returned across the coil by the run-around. It also takes the same ${n(R.reheat,1)} kW off the cooling duty — size the chiller on ${n(R.total-R.reheat,1)} kW, not ${n(R.total,1)} kW.`);
    else push(pct>25?'warn':'ok','Reheat is being paid for',
      `${n(R.reheat,1)} kW, which is ${n(pct,0)}% of the cooling duty. A run-around coil or heat pipe across the cooling coil would recover it and cut the chiller by the same amount. Part L expects simultaneous heating and cooling to be justified.`);
  } else push('ok','No reheat needed','The coil lands on the supply condition without a reheat battery.');

  if(S.faceVel>2.8) push('bad','Face velocity will carry water off the coil',`${n(S.faceVel,2)} m/s on a wet coil. Keep it at or under 2.5 m/s or fit eliminators.`);
  else if(S.faceVel>2.5) push('warn','Face velocity is at the limit',`${n(S.faceVel,2)} m/s. Fine dry, marginal wet.`);
  else push('ok','Face velocity is sound',`${n(S.faceVel,2)} m/s across ${n(R.faceArea,2)} m² of coil face.`);

  if(R.dtSupply>11) push('warn','Supply air is very cold relative to the room',`${n(R.dtSupply,1)} K below room. Needs high-induction diffusers or you will get dumping and cold complaints.`);
  if(R.fogKgh>0.01) push('warn','The fresh air fogs when it meets the return air',
    `Mixing ${n(S.osDB,0)}°C / ${n(S.osRH,0)}% outside air into a ${n(S.roomT,0)}°C room gives a supersaturated mixture: about ${muBoth(R.fogKgh)} drops out in the mixing section${S.roomT<0?' as frost':' as water'} before the coil sees it. Pre-treat or reduce the fresh air, or take it through the heat recovery first.`);
  if(R.frosting){
    const a=R.frostAcc;
    push('warn','The coil runs frosted — moisture builds up as ice, not condensate',
      `Apparatus dew point ${n(R.t_ADP,1)}°C. The ${muBoth(R.cond)} taken out of the air is held on the fins as frost, so after ${n(S.defrostH||8,1)} h there is ${n(a.massKg,1)} kg of ice on the block and ${n(a.meltwaterL,1)} litres to drain at defrost. Freezing and sub-cooling it adds ${n(R.frostKW,2)} kW to the coil duty, and the defrost has to put ${n(a.defrostKWh,2)} kWh back (${n(a.sensKWh,2)} warming the ice, ${n(a.meltKWh,2)} melting it). Airflow will fall as the block ices, so allow for it in the fan and specify the defrost — hot gas, electric or reverse cycle — and a heated drain.`);
  } else if(R.wet) push('ok','Condensate drain',`Wet coil: ${muBoth(R.cond)}. Trap depth must exceed the fan negative static or the drain will not run.`);

  if(R.leakOut<-0.5) push('warn','More air leaves than enters — a make-up path is needed',
    `Exhaust and extract take ${fu(-R.leakOut)} more than the fresh air brings in. That shortfall will be drawn in through doors, louvres or the shell — provide a deliberate make-up path (transfer grilles, relief) rather than letting the room starve. No pressure is calculated; pressure modelling was removed as too flaky.`);
  else if(R.leakOut>0.5) push('ok','Air balance leaves a surplus',
    `${fu(R.leakOut)} more supplied than extracted — it finds its own way out through doors and relief. No pressure is calculated.`);
  else push('ok','Air balance closes',`Fresh air in matches exhaust and extract out within ${fu(Math.abs(R.leakOut))}.`);
  if(((S.coilPreset||'').startsWith('dx')&&S.coolSrc!=='dx')||((S.coilPreset||'').startsWith('chw')&&S.coolSrc!=='chw'))
    push('warn','Coil choice does not match the cooling source',
      `A ${(COILPRESETS[S.coilPreset]||{}).short||'custom'} coil is chosen with ${S.coolSrc==='dx'?'DX':'chilled-water'} cooling. Line the two up — or switch the choice to Custom and type the selected contact factor.`);
  if(R.hrRatio>0) push('ok','Heat recovery is earning its place',
    `${n(R.hrSaved,1)} kW off the fresh air. The exhaust covers ${n(R.hrRatio*100,0)}% of the fresh air stream.`);
  else if(S.hrType!=='none') push('warn','Heat recovery has nothing to work against',
    'Recovery is selected but no air is being spilled at the unit. It needs an exhaust stream — either spill some return, or take the recovery out of the price.');
  const occN=occOf(S).n, oapp=occN>0?R.oa_ls/occN:0;
  if(occN>0) push(oapp<8?'warn':'ok','Fresh air per person',`${fu(oapp,1)} per person at design occupancy (${n(occN,0)} people in the sizing scenario).`);

  if(HM==='none') push('na','Off-design check — mild and damp (reported, not assessed)',
   `At ${n(S.shDB,0)}°C / ${n(S.shRH,0)}% outside with ${n(S.shLoad,0)}% of the sensible load, the room settles at about ${n(Math.min(R.shRHroom,100),0)}% RH. No humidity requirement is set, so this is reported only.`);
  else{
  const shOK=Math.abs(R.shRHroom-S.roomRH)<=rhTol;
  push(R.shRHroom>100?'bad':shOK?'ok':'warn','Off-design check — mild and damp',
   `At ${n(S.shDB,0)}°C / ${n(S.shRH,0)}% outside with ${n(S.shLoad,0)}% of the sensible load, the room settles at ${n(Math.min(R.shRHroom,100),0)}% RH. ${shOK?'Holds.':'Outside tolerance — you need humidity-priority control with reheat, or the room drifts wet on mild mornings.'}`);
  }

  if(R.heatShort>0) push('warn','Air alone will not heat the space',
   `Holding to ${n(S.dtHeatMax,0)} K above room leaves ${n(R.heatShort,1)} kW short in winter. Add radiant, LPHW perimeter or more air.`);
  else push('ok','Winter heating covered by the air',`Supply at ${n(R.ts_w,1)}°C, heater battery ${n(R.heater,1)} kW.`);

  if(R.humKgh>0) push('ok','Winter humidification needed',
   `${n(R.humKgh,1)} kg/h ${S.humid==='steam'?'as steam, about '+n(R.humkW,1)+' kW':'adiabatic — preheat to '+n(R.preheatAdb,1)+'°C first'}. ${S.humid==='none'?'':''}`);
  if(S.humid==='none'&&R.humKgh>0) push('warn','No humidifier selected','The space will fall below the humidity target in winter.');
  if(S.coolSrc==='dx'){
    if(S.evapT<1&&!R.frosting) push('warn','Evaporating temperature will frost the coil at part load',`${n(S.evapT,1)}°C. Below about 1°C you need hot gas or reverse-cycle defrost, and part load makes it worse.`);
    push(S.reheatSrc==='hotgas'?'ok':'warn','DX humidity control at part load',
      S.reheatSrc==='hotgas'?'Hot gas reheat lets the unit run the coil for moisture and put the heat back — that is the right arrangement for humidity control on DX.':'A DX coil only dehumidifies while the compressor runs, so step or on/off control makes the room swing. Inverter compressors with hot gas reheat is what actually holds a tight RH.');
    push('ok','DX electrical load',`${n(R.dxAbs,1)} kW absorbed at EER ${n(S.dxEER,1)} — about ${n(R.amps(R.dxAbs),0)} A at 400 V three phase.`);
  }
  if(S.reheatSrc==='hotgas'&&R.reheat>0) push('ok','Hot gas reheat is free to run',
    `${n(R.reheat,1)} kW of condenser heat back into the air. It costs nothing to run, but unlike a run-around it does not reduce the ${n(R.total,1)} kW cooling duty — the condenser still rejects the rest.`);
  if(S.reheatSrc==='elec'&&R.reheat>0) push('warn','Electric reheat',
    `${n(R.reheat,1)} kW on resistance heat, about ${n(R.amps(R.reheat),0)} A at 400 V. Bought at full price and running at the same time as the cooling.`);
  if(S.heatSrc==='elec'&&R.heater>0) push('warn','Electric heater battery',
    `${n(R.heater,1)} kW, about ${n(R.amps(R.heater),0)} A at 400 V three phase. Check the incomer will take it before you promise it.`);
  if(S.heatSrc==='hp'&&R.heater>0) push('warn','Heat pump heating at winter design',
    `${n(R.heater,1)} kW needed, ${n(R.hpAbs,1)} kW absorbed at COP ${n(S.hpCOP,1)}. Confirm the unit still makes ${n(R.heater,1)} kW at ${n(S.owDB,1)}°C after defrost. Published heating capacities are rated to BS EN 14511 at 7°C dry bulb / 6°C wet bulb outside, so a headline figure is not the figure at your winter design temperature.`);
  if(R.elecTotal>0) push('ok','Electrical load of this plant',
    `${n(R.elecTotal,1)} kW, about ${n(R.amps(R.elecTotal),0)} A at 400 V three phase, fans excluded.`);
  if(S.owDB<=3){
    const sug=R.frostSuggest;
    if(S.frostProv==='coil'&&R.frostAuto) push('warn','Frost coil duty is suggested, not confirmed',
      'Suggested '+n(sug,1)+' kW '+frostSrcTxt()+' to hold '+fu(R.oa_ls)+' of fresh air at +5°C in winter design. This is carried through as a working figure only \u2014 confirm the selection or type the rated duty under Frost protection.');
    else if(S.frostProv==='coil'&&S.frostDuty+1e-6>=sug) push('ok','Frost coil covers the suggested preheat',
      `${n(S.frostDuty,1)} kW rated against ${n(sug,1)} kW to hold ${fu(R.oa_ls)} of fresh air at +5\u00b0C in winter design${S.frostSrc==='lphw'?`, drawing ${wu(R.frostFlow)} at ${n(S.lphwF,0)}/${n(S.lphwR,0)}\u00b0C`:S.frostSrc==='elec'?`, about ${n(R.amps(R.frostDutyEff),0)} A at 400 V`:''}. Confirm controls, frost-stat and drain-down with the supplier — the weather that sizes it is the weather you confirmed above.`);
    else if(S.frostProv==='coil'&&S.frostDuty>0) push('bad','Frost coil is short of the suggested preheat',
      `${n(S.frostDuty,1)} kW rated against ${n(sug,1)} kW to hold ${fu(R.oa_ls)} of fresh air at +5\u00b0C. Upsize it or the recovery and cooling coil behind it will freeze.`);
    else if(S.frostProv==='coil') push('warn','Frost coil selected but no duty entered',
      `About ${n(sug,1)} kW is needed to hold ${fu(R.oa_ls)} of fresh air at +5\u00b0C in winter design. Enter the rated duty under Frost protection.`);
    else if(S.frostProv==='strategy'&&(S.frostNote||'').trim()) push('ok','Frost strategy recorded as provided',
      `“${(S.frostNote||'').trim().slice(0,140)}” — taken as provided for ${n(sug,1)} kW of winter preheat duty. Nothing else going green confirms it; only this entry does.`);
    else push('warn','Frost protection is still required — here is what is needed',
      `Heat ${fu(R.oa_ls)} of fresh air from ${n(S.owDB,1)}\u00b0C to +5\u00b0C before it can meet the recovery or the cooling coil: about ${n(sug,1)} kW at winter design. Choose a frost coil or describe the strategy under Frost protection — until then this stays an outstanding requirement, not a pass.`);
  }
  push('ok','Air change rates',`${n(R.ach,1)} ac/h of supply air on the ${n(R.V,0)} m³ room (${fu(R.flow)}), of which ${n(R.achFresh,2)} ac/h is fresh air (${fu(R.oa_ls)}). ${S.minACH>0?'The minimum imposed is '+n(S.minACH,1)+' ac/h.':''}`);
  return C;
}

function chart(R){
  const C=pal(), P=S.pressure, X0=52,X1=600,Y0=356,Y1=20;
  const adpS={t:R.t_ADP,W:R.W_ADP};
  const r=chartRange([R.OA,R.E,adpS,R.off,R.supply,R.roomAct,R.OW,R.Ew,{t:R.ts_w,W:R.Ew.W}],-10,45,24);
  const F=psyGrid(X0,X1,Y0,Y1,r,P), {px,py,wB}=F;
  let g=F.g;
  // control box
  const bx1=px(S.roomT-S.tolT),bx2=px(S.roomT+S.tolT);
  const bw1=WfromRH(S.roomT,Math.max(.01,(S.roomRH-S.tolRH)/100),P)*1000, bw2=WfromRH(S.roomT,Math.min(1,(S.roomRH+S.tolRH)/100),P)*1000;
  g+=`<rect x="${bx1}" y="${py(bw2)}" width="${bx2-bx1}" height="${py(bw1)-py(bw2)}" fill="${C.tolBox}" stroke="${C.brand}" stroke-dasharray="3 3"/>`;
  const pts=[['O',R.OA,C.amber],['M',R.E,C.violet],['ADP',adpS,C.cool],
    ['C',R.off,C.cool],['S',R.supply,C.brand],['R',R.roomAct,C.ink]];
  let path='';
  [R.OA,R.E,R.off,R.supply,R.roomAct].forEach((p,i)=>{path+=(i?'L':'M')+px(p.t)+' '+py(Math.min(p.W*1000,wB));});
  g+=`<path d="${path}" fill="none" stroke="${C.brand}" stroke-width="1.6" opacity=".85"/>`;
  g+=`<line x1="${px(R.E.t)}" y1="${py(R.E.W*1000)}" x2="${px(R.t_ADP)}" y2="${py(R.W_ADP*1000)}" stroke="${C.cool}" stroke-dasharray="4 3" opacity=".7"/>`;
  // winter
  g+=`<path d="M${px(R.OW.t)} ${py(R.OW.W*1000)}L${px(R.Ew.t)} ${py(R.Ew.W*1000)}L${px(R.ts_w)} ${py(Math.max(R.Ew.W,R.room.W-R.latKgh/3600/R.mda)*1000)}" fill="none" stroke="${C.amber}" stroke-width="1.3" stroke-dasharray="5 4" opacity=".75"/>`;
  g+=`<circle cx="${px(R.OW.t)}" cy="${py(R.OW.W*1000)}" r="3.5" fill="${C.amber}"/><text x="${px(R.OW.t)+7}" y="${py(R.OW.W*1000)+4}" fill="${C.amber}" font-size="10" font-family="${FM}">Ow</text>`;
  pts.forEach(p=>{const x=px(p[1].t),y=py(Math.min(p[1].W*1000,wB));
    g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${p[2]}" stroke="${C.outline}" stroke-width="1.5"/>
        <text x="${x+7}" y="${y-6}" fill="${p[2]}" font-size="11" font-weight="600" font-family="${FM}">${p[0]}</text>`;});
  return `<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

  }

   ${moistureBlock(R.cond,R.frosting,R.t_ADP,Object.assign({hours:S.defrostH||8},R.frostAcc))}

   </div></details>`;

   <div class="legend"><span><i style="background:${C2.brand}"></i>summer process</span><span><i style="background:${C2.cool}"></i>coil line to ADP</span>

   <div class="tw"><table class="st">

   </table></div>
   <div class="note">Indicative coil depth assumes about 2.5 m/s face velocity and normal fin spacing — confirm against the manufacturer's selection. Every figure here is a design-point calculation, not a substitute for a coil selection program.</div>
   </div></details>`;

  document.getElementById('foot').innerHTML=
   `RoomFirst · air and plant selection from the client's room condition. Moist-air properties to the ASHRAE Hyland–Wexler formulation, saturation over ice below 0°C; frosted coils carry the heat of fusion (333.6 kJ/kg) and ice sub-cooling.

/* air-path states: [label, state, note] — shared by the table and the PDF */
function airPath(R){
  return [['O · Outside air',R.OA,'summer design'],
   ['M · Onto the coil',R.E,n(R.oaPct,0)+'% fresh'],
   ['ADP · Apparatus dew point',{t:R.t_ADP,W:R.W_ADP,rh:1,h:enth(R.t_ADP,R.W_ADP),dp:R.t_ADP},'CF '+n(R.CF,2)+(R.frosting?' · frosted':'')],
   ['C · Off the coil',R.off,R.frosting?'frosted':R.wet?'wet':'dry'],
   ['S · Into the room',R.supply,'+'+n(R.fanRise,1)+'K fan'+(R.reheat>0?', reheated':'')],
   ['R · Room achieved',R.roomAct,''],
   ['T · Room asked for',R.room,'target']];
}
/* recommended equipment: [label, value, note] — shared by the table and the PDF */
function equipRows(R){
  const rows=[
   ['Supply airflow',fu(R.flow),fother(R.flow)],
   ['Air change rate — total',`${n(R.ach,1)} ac/h`,`${fu(R.flow)} on ${n(R.V,0)} m³ (${n(S.roomArea,0)} m² × ${n(S.roomHeight,1)} m)`],
   ['Air change rate — fresh air',`${n(R.achFresh,2)} ac/h`,`${fu(R.oa_ls)} · ${n(R.oaPct,0)}% of supply${occOf(S).n>0?' · '+fu(R.oa_ls/occOf(S).n,1)+' per person':''}`],
   ['Fresh air / extract replaced',`${fu(R.oa_ls)} / ${fu(S.extract)}`,''],
   ['Exhaust spilled at the unit',fu(R.exh_ls),''],
   ['Air balance — surplus / shortfall',R.leakOut>=0?fu(R.leakOut)+' surplus':fu(-R.leakOut)+' shortfall',R.leakOut>=0?'out via doors/relief (not quantified)':'provide a make-up path (not quantified)'],
   ['Cooling coil total / sensible / latent',`${n(R.total,1)} / ${n(R.sens,1)} / ${n(R.lat,1)} kW`,R.frosting?`incl. ${n(R.frostKW,2)} kW to freeze the frost`:''],
   ['Coil face area at '+n(S.faceVel,2)+' m/s',`${n(R.faceArea,2)} m²`,''],
   ['Indicative coil depth for CF '+n(R.CF,2),`${R.rows} row`,''],
   ['Supply air mass flow',`${n(R.mda,3)} kg/s`,`${n(R.mda*3600,0)} kg/h dry air`],
   ['Water brought in by the fresh air',mu(Math.max(0,R.oa_ls/1000/R.FAs.v*(R.FAs.W-R.room.W)*3600)),muOther(Math.max(0,R.oa_ls/1000/R.FAs.v*(R.FAs.W-R.room.W)*3600))],
   ['Water generated inside the room',mu(R.latKgh),muOther(R.latKgh)],
   ['Moisture removed at the coil',mu(R.cond),muOther(R.cond)],
   [R.frosting?'Held as frost on the coil':'Condensate to drain',mu(R.cond),R.frosting?`ice at ${n(R.t_ADP,1)}°C · ${n(R.frostAcc.massKg,1)} kg after ${n(S.defrostH||8,1)} h`:`${n(R.cond*24,0)} l/day at the drain`]];
  if(R.frosting) rows.push(['Defrost',`${n(R.frostAcc.defrostKWh,2)} kWh every ${n(S.defrostH||8,1)} h`,`${n(R.frostAcc.meltwaterL,1)} l meltwater · ${n(R.frostAcc.sensKWh,2)} kWh warming + ${n(R.frostAcc.meltKWh,2)} kWh melting`]);
  if(S.coolSrc==='chw') rows.push(['Chilled water flow '+(S.glycol>0?'('+n(S.glycol,0)+'% glycol)':''),`${wu(R.chwFlow)}`,`at ${n(S.chwR-S.chwF,0)} K · ${n(S.chwF,1)}/${n(S.chwR,1)}°C`]);
  else {rows.push(['DX evaporating temperature',`${n(S.evapT,1)} °C`,'']); rows.push(['DX absorbed power at EER '+n(S.dxEER,1),`${n(R.dxAbs,1)} kW`,`${n(R.amps(R.dxAbs),0)} A at 400 V`]);}
  if(S.reheatSrc==='recover'&&R.reheat>0) rows.push(['Cooling duty with the run-around in service',`${n(R.total-R.reheat,1)} kW`,'']);
  rows.push(['Cooling duty — gross at the coil',`${n(R.total,1)} kW`,'']);
  rows.push(['Cooling duty — net into the space',`${n(R.netCool,1)} kW`,'']);
  rows.push(['Supply fan and motor heat',`${n(R.fanKW,1)} kW`,`${n(R.fanRise,2)} K rise`]);
  rows.push(['Fresh-air share of the cooling duty',`${n(R.oaLoad,1)} kW`,'']);
  rows.push(['Reheat battery ('+(S.reheatSrc==='hotgas'?'hot gas':S.reheatSrc==='recover'?'run-around':S.reheatSrc)+')',`${n(R.reheat,1)} kW`,S.reheatSrc==='lphw'?wu(R.lphwFlow)+' LPHW':S.reheatSrc==='elec'?n(R.amps(R.reheat),0)+' A':R.reheatFree?'free':'']);

<script>
/* =====================================================================================

const JSPDF_SRC='https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
function loadJsPDF(){
  if(window.jspdf&&window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  return new Promise((res,rej)=>{const s=document.createElement('script'); s.src=JSPDF_SRC; s.async=true;
    s.onload=()=>window.jspdf&&window.jspdf.jsPDF?res(window.jspdf.jsPDF):rej(new Error('jsPDF missing'));
    s.onerror=()=>rej(new Error('jsPDF failed to load')); document.head.appendChild(s);});
}
/* Helvetica in jsPDF only covers WinAnsi — swap the few symbols the page uses that fall outside it. */
function pdfText(s){return String(s??'').replace(/<[^>]+>/g,'')
  .replace(/&nbsp;|&#160;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
  .replace(/[\u202f\u00a0\u2009]/g,' ').replace(/\u2713|\u2714/g,'OK').replace(/\u2715|\u2716|\u2717/g,'X')
  .replace(/\u221e/g,'infinity').replace(/\u2248/g,'~').replace(/\u2192/g,'->').replace(/\u0394/g,'delta ')
  .replace(/\u2212/g,'-').replace(/\u2026/g,'...').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=').replace(/\u02dc/g,'~')
  .replace(/\u263e|\u2600/g,'');}
/* Rasterise an SVG string (drawn with the light palette) so it can be dropped into the PDF. */
function svgToPng(svg,w,h,scale){
  return new Promise((res,rej)=>{
    const src=svg.replace(/<svg /,`<svg width="${w}" height="${h}" `).replace(/<svg([^>]*)>/,`<svg$1><rect width="${w}" height="${h}" fill="#ffffff"/>`);
    const blob=new Blob([src],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
    img.onload=()=>{try{const c=document.createElement('canvas'); c.width=Math.round(w*scale); c.height=Math.round(h*scale);
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/png'));}catch(e){URL.revokeObjectURL(url); rej(e);}};
    img.onerror=e=>{URL.revokeObjectURL(url); rej(e);}; img.src=url;});
}

const PDFC={ink:'#0F1F2E',muted:'#5B7186',faint:'#D3DCE6',panel:'#F1F5F9',brand:'#1B6FD6',amber:'#B8690A',ok:'#1E8E52',warn:'#9C7500',bad:'#CC3B33',frost:'#1785B8'};

      ['Liquid to drain',mu(R.frosting?0:R.cond),R.frosting?'coil surface below 0°C':n(R.cond*24,0)+' l/day'],
      ['Held as frost',mu(R.frosting?R.cond:0),R.frosting?`ice at ${n(R.t_ADP,1)}°C · ${n(R.frostAcc.massKg,1)} kg after ${n(S.defrostH||8,1)} h · ${n(R.frostAcc.defrostKWh,2)} kWh to defrost`:'coil above 0°C']]);
    L.ensure(14+150*400/620); L.title('E','The chart','summer process, coil line, winter, tolerance box');
    try{L.image(await svgToPng(chs,620,400,2.5),620,400,150);}catch(e){L.para('Chart could not be rendered in this browser.',8,PDFC.muted);}
    L.title('F','Recommended equipment','what to specify and buy'); L.rows(equipRows(R));
  } else if(MODE==='site'){
    const Q=surveyCalc(), C=surveyChecks(Q), worst=C.some(c=>c.lv==='bad')?'bad':C.some(c=>c.lv==='warn')?'warn':'ok';
    L.chips([{k:'MEASURED AIRFLOW',v:fu(S.svFlow),s:fother(S.svFlow)},{k:'ROOM SENSIBLE',v:n(Q.sens,1)+' kW'},{k:'ROOM LATENT',v:n(Q.lat,1)+' kW',s:mu(Q.moist)},
      {k:'ROOM',v:n(Q.ret.t,1)+'°C / '+n(Q.ret.rh*100,0)+'%',s:worst==='ok'?'as expected':worst==='warn'?'check':'out of spec',col:worst==='ok'?PDFC.ok:worst==='warn'?PDFC.warn:PDFC.bad}]);
    inputs.forEach(sec=>{L.title(sec.title.split(' · ')[0],sec.title.split(' · ')[1],'readings'); L.rows(sec.rows,[0.6,0.4,0]);});
    L.title('1','What the room is doing',''); L.rows(surveyRows(Q));
    L.title('2','Sense check',C.filter(c=>c.lv!=='ok').length+' to look at'); L.checks(C);
    L.ensure(14+40+150*344/620); L.title('3','The readings on the chart','');
    L.table(['Point','°C','%RH','g/kg','kJ/kg','DP °C','WB °C'],surveyStates(Q).map(p=>[p[0],n(p[1].t,1),n(p[1].rh*100,0),n(p[1].W*1000,2),n(p[1].h,1),n(p[1].dp,1),n(p[1].wb,1)]),[0.34,0.11,0.11,0.11,0.11,0.11,0.11],['l','r','r','r','r','r','r']);
    FORCE_LIGHT=true; let chs; try{chs=surveyChart(Q);} finally{FORCE_LIGHT=false;}
    try{L.image(await svgToPng(chs,620,344,2.5),620,344,150);}catch(e){}
  } else {
    const Q=senseCalc(), a=Q.a, b=Q.b;
    L.chips([{k:'AIR',v:n(SENSE.t,1)+'°C / '+n(SENSE.rh,0)+'%',s:n(a.W*1000,2)+' g/kg'},{k:'COOLED TO',v:n(SENSE.c,1)+'°C',s:n(b.rh*100,0)+'% RH'},
      {k:'AIRFLOW',v:fu(SENSE.f),s:fother(SENSE.f)},{k:Q.frosting?'HELD AS FROST':'WATER REMOVED',v:mu(Q.waterKgh),s:muOther(Q.waterKgh),col:Q.frosting?PDFC.frost:PDFC.brand}]);
    L.title('~','Where that air sits','');
    L.rows([['Dry bulb',n(a.t,1)+' °C'],['Relative humidity',n(a.rh*100,0)+' %'],['Moisture content',n(a.W*1000,2)+' g/kg'],[a.dp<0?'Frost point':'Dew point',n(a.dp,1)+' °C'],
      ['Wet bulb',n(a.wb,1)+' °C'],['Enthalpy',n(a.h,1)+' kJ/kg'],['Density',n(1/a.v,3)+' kg/m³'],['Air mass flow',n(Q.mda,3)+' kg/s',n(Q.mda*3600,0)+' kg/h']]);
    L.title('~','Cooled to '+n(SENSE.c,1)+'°C','');
    L.rows([['Leaving RH',n(b.rh*100,0)+' %',Q.cooled?(Q.frosting?'saturated — freezes on the surface':'saturated — water drops out'):'no condensation'],
      ['Moisture removed',n(Q.drop,2)+' g/kg'],[Q.frosting?'Held as frost':'Water to drain',mu(Q.waterKgh),muOther(Q.waterKgh)],
      ...(Q.frosting?[['Frost after 8 h',n(Q.frostAcc.massKg,1)+' kg',n(Q.frostAcc.defrostKWh,2)+' kWh to defrost']]:[]),
      ['Cooling duty',n(Q.kW,2)+' kW',Q.frosting?'incl. '+n(Q.frostKW,2)+' kW frost load':''],['Sensible / latent',n(Q.sensKW,1)+' / '+n(Q.latKW,1)+' kW',n(Q.dh,1)+' kJ/kg']]);
    FORCE_LIGHT=true; let chs; try{chs=senseChart(a,b,Q.cooled);} finally{FORCE_LIGHT=false;}
    try{L.image(await svgToPng(chs,620,320,2.5),620,320,150);}catch(e){}
  }
  footer(L.page);
  return doc;
}
let PDF_BUSY=false;
async function exportPDF(){
  if(PDF_BUSY) return; PDF_BUSY=true;
  const btn=document.getElementById('pdfBtn'); if(btn){btn.disabled=true; btn.textContent='PDF…';}
  try{
    let jsPDF; try{jsPDF=await loadJsPDF();}catch(e){
      toast('Could not reach the PDF library (offline?) — using the browser print dialog: choose "Save as PDF".',5000);
      setTimeout(()=>window.print(),400); return;}
    toast('Building the PDF…',1500);
    const doc=await buildPdfDoc(jsPDF);
    const safe=(jobRef()||'room-first').replace(/[^\w\-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'room-first';
    const fn=`${safe}-${MODE}.pdf`, blob=doc.output('blob');
    const touch=matchMedia('(pointer: coarse)').matches||/iPad|iPhone|iPod|Android/.test(navigator.userAgent);
    if(touch&&navigator.share&&navigator.canShare){
      const file=new File([blob],fn,{type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:jobRef()||'RoomFirst report'}); toast('PDF handed to the share sheet'); return;}
        catch(e){if(e&&e.name==='AbortError') return;}
      }
    }
    doc.save(fn); toast('PDF saved: '+fn);
  }catch(e){console.error(e); toast('Could not create the PDF — '+(e&&e.message||'unknown error'),5000);}
  finally{PDF_BUSY=false; if(btn){btn.disabled=false; btn.textContent='PDF';}}
}
</script>
