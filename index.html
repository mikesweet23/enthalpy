<style>
:root{
  --ground:#08131F; --panel:#0E1E2E; --panel2:#12273A; --line:#1B3348; --line2:#2A4F72;
  --ink:#E6EEF6; --ink2:#B9CBDD; --muted:#7E97AE;
  --brand:#2E90FF; --cyan:#2E90FF; --cool:#5FC8F5; --amber:#F2A03F; --blue:#5FC8F5; --violet:#A98BFF;
  --ok:#4ED08A; --warn:#F5C44B; --bad:#FF6B6B;
  --on-brand:#04121F;            /* text sitting on a brand-coloured button */
  --rule:rgba(27,51,72,.55);     /* hairlines between fields and table rows */
  --header-bg:rgba(8,19,31,.94); --bar-bg:rgba(9,20,32,.97);
  --track:#0B1A28; --fill:#1C3550;
  --res1:#10263A; --res2:#0C1B29;
  --sv1:#17202B; --sv2:#0E1E2E; --svline:#5A4520;
  --brand-wash:rgba(46,144,255,.07); --bad-wash:rgba(255,107,107,.08); --frost-wash:rgba(95,200,245,.10);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
:root[data-theme=light]{
  --ground:#EEF2F7; --panel:#FFFFFF; --panel2:#F1F5F9; --line:#D3DCE6; --line2:#AFBFD0;
  --ink:#0F1F2E; --ink2:#2C4356; --muted:#5B7186;
  --brand:#1B6FD6; --cyan:#1B6FD6; --cool:#1785B8; --amber:#B8690A; --blue:#1785B8; --violet:#6A4BD1;
  --ok:#1E8E52; --warn:#9C7500; --bad:#CC3B33;
  --on-brand:#FFFFFF;
  --rule:rgba(15,31,46,.12);
  --header-bg:rgba(238,242,247,.94); --bar-bg:rgba(255,255,255,.97);
  --track:#E3EAF2; --fill:#B9CFE8;
  --res1:#FFFFFF; --res2:#EEF3F9;
  --sv1:#FFF8EC; --sv2:#FFFFFF; --svline:#E0B872;
  --brand-wash:rgba(27,111,214,.08); --bad-wash:rgba(204,59,51,.08); --frost-wash:rgba(23,133,184,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--ground); color:var(--ink); font-family:var(--body);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:96px;
}
h1,h2,h3,h4{font-family:var(--cond); font-weight:700; margin:0; letter-spacing:.01em}
a{color:var(--cyan)}

/* ---------- shell ---------- */
header.top{
  position:sticky; top:0; z-index:40; background:var(--header-bg);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.topin{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--cyan)}
.jobname{
  flex:1;min-width:60px;background:transparent;border:0;border-bottom:1px dashed var(--line2);
  color:var(--ink);font-family:var(--cond);font-size:15px;padding:3px 2px;
}
.jobname:focus{outline:none;border-bottom-color:var(--cyan)}
.tbtn{
  background:var(--panel);border:1px solid var(--line2);color:var(--ink2);
  font-family:var(--cond);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap
}
.tbtn:hover{border-color:var(--cyan);color:var(--cyan)}
.modesw{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.modesw button{background:transparent;border:0;border-right:1px solid var(--line2);color:var(--ink2);
  font-family:var(--cond);font-size:12.5px;letter-spacing:.03em;padding:7px 12px;cursor:pointer;white-space:nowrap}
.modesw button:last-child{border-right:0}
.modesw button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);font-weight:700}
.modesw button[data-m=site][aria-pressed=true]{background:var(--amber)}
.unitwrap{display:flex;align-items:center;gap:7px}
.unitlbl{font-family:var(--cond);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.modesw.unitsw button{font-family:var(--mono);font-size:12px;padding:7px 9px}
/* inline unit toggle — sits next to an input or a result and switches the same global unit */
.itog{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden;vertical-align:middle;flex:0 0 auto}
.itog button{background:transparent;border:0;border-right:1px solid var(--line2);color:var(--muted);
  font-family:var(--mono);font-size:10.5px;padding:3px 6px;cursor:pointer;white-space:nowrap;line-height:1.2;
  text-transform:none;letter-spacing:0}
.itog button:last-child{border-right:0}
.itog button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);font-weight:600}
.itog button:hover{color:var(--ink)}
.itog button[aria-pressed=true]:hover{color:var(--on-brand)}
.tbtn.theme{font-family:var(--body);font-size:14px;padding:5px 9px;text-transform:none;letter-spacing:0}
.sl{display:flex;align-items:center;gap:12px;padding:9px 0}
.sl label{flex:0 0 108px;font-size:13px;color:var(--ink2)}
.sl input[type=range]{flex:1;accent-color:var(--brand);height:26px;background:transparent}
.sl .rv{font-family:var(--mono);font-size:15px;font-weight:600;width:80px;text-align:right}
.senseg{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--line);margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.senseg>div{background:var(--panel);padding:9px 11px}
.senseg .k{font-family:var(--cond);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.senseg .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px}

.wrap{max-width:1400px;margin:0 auto;padding:16px}
.leftcol,.rightcol{min-width:0}
@media(min-width:1080px){
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .rightcol{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow-y:auto;padding-right:4px}
}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.svcard{border-color:var(--svline);background:linear-gradient(180deg,var(--sv1),var(--sv2))}
.svcard>summary .step{color:var(--amber);border-color:var(--svline)}
.card>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:baseline;gap:10px}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:'+';margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:17px}
.card[open]>summary::after{content:'–'}
.card[open]>summary{border-bottom:1px solid var(--line)}
.step{font-family:var(--mono);font-size:11px;color:var(--cyan);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
.card h2{font-size:17px}
.sub{font-size:12px;color:var(--muted);font-family:var(--cond);letter-spacing:.03em}
.cbody{padding:12px 15px 16px}

/* ---------- fields ---------- */
.field{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.field:last-child{border-bottom:0}
.field label{flex:1 1 160px;font-size:13.5px;color:var(--ink2)}
.field .u{font-family:var(--mono);font-size:11px;color:var(--muted);width:44px;text-align:left}
.field .u.wide{width:auto}
input[type=number],input[type=text],select{
  background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  font-family:var(--mono);font-size:14px;padding:6px 8px;border-radius:6px;width:96px;text-align:right;
}
select{width:auto;max-width:190px;text-align:left;font-family:var(--body);font-size:13px}
input:focus,select:focus{outline:2px solid var(--cyan);outline-offset:-1px}
input:disabled{opacity:.35}
.hint{font-size:11.5px;color:var(--muted);padding:2px 0 8px;line-height:1.4}
/* ---------- input grouping: alternate shading + dependent tint ----------
   Every input row alternates so rows don't blur together. Any input that only
   appears because of another choice sits in a tinted block with a caption naming
   the parent choice, so it is always clear what drives what. */
.fw{border-radius:8px;padding:2px 8px;margin:0 -8px}
.fw.alt{background:rgba(127,151,174,.07)}
.fw.dep{background:var(--brand-wash);border-left:3px solid var(--brand);padding-left:9px}
.why{font-size:11px;color:var(--cyan);font-family:var(--cond);letter-spacing:.03em;padding:4px 0 0}
.grphead{margin:12px 0 2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.grphead b{font-family:var(--cond);font-size:13.5px;letter-spacing:.02em}
.grphead span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--line2);color:var(--ink2);
  font-family:var(--cond);font-size:12.5px;padding:7px 11px;cursor:pointer
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--cyan);color:var(--on-brand);font-weight:700}
.grp{margin:10px 0 4px;font-family:var(--cond);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- results ---------- */
.rescard{background:linear-gradient(180deg,var(--res1),var(--res2));border:1px solid var(--line2)}
.big{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0}
.kpi>div{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi .k{font-family:var(--cond);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:2px}
.kpi .n{font-size:11px;color:var(--muted);margin-top:1px}

/* ladder — signature element */
.ladder{padding:4px 0 2px}
.lrow{display:grid;grid-template-columns:112px 1fr 96px;align-items:center;gap:9px;padding:4px 0}
.lname{font-family:var(--cond);font-size:12.5px;color:var(--ink2);text-align:right;letter-spacing:.02em}
.ltrack{height:16px;background:var(--track);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.lfill{position:absolute;left:0;top:0;bottom:0;background:var(--fill);transition:width .35s cubic-bezier(.2,.7,.3,1)}
.lrow.win .lfill{background:linear-gradient(90deg,var(--line2),var(--cyan))}
.lrow.win .lname{color:var(--cyan);font-weight:700}
.lval{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.lrow.win .lval{color:var(--ink)}
.lrow.na .ltrack{opacity:.35}
.lrow.short .lfill{background:linear-gradient(90deg,var(--line2),var(--bad))}
.lrow.short .lname{color:var(--bad)}
.lrow.sel .lfill{background:linear-gradient(90deg,var(--line2),var(--ink))}
.lrow.sel .lname{color:var(--ink);font-weight:700}
.lmark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.driver{
  margin-top:10px;padding:10px 12px;border-left:3px solid var(--cyan);background:var(--brand-wash);
  font-size:13.5px;border-radius:0 7px 7px 0
}
.driver b{color:var(--cyan)}
.driver.bad{border-left-color:var(--bad);background:var(--bad-wash);color:var(--ink)}
.driver.frost{border-left-color:var(--cool);background:var(--frost-wash)}
.driver.frost b{color:var(--cool)}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.st{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
table.st th{font-family:var(--cond);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:5px 4px;border-bottom:1px solid var(--line2);font-weight:600}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st td{padding:5px 4px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
table.st td:first-child{font-family:var(--body);font-size:12.5px;color:var(--ink2);white-space:normal}
table.st td.mut{white-space:normal}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.chk{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px;align-items:flex-start}
.chk:last-child{border-bottom:0}
.chk .ic{font-family:var(--mono);font-size:12px;font-weight:600;min-width:16px}
.chk .tx b{font-family:var(--cond);letter-spacing:.02em}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--muted)}.frostc{color:var(--cool)}
.pill{display:inline-block;font-family:var(--cond);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid currentColor;margin-left:6px}
.rowhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 0 8px}
.rowhead .k{font-family:var(--cond);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rowhead .sp{flex:1}
.moist{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.moist>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
.moist>div.on{border-color:var(--cool);background:var(--frost-wash)}
.moist .k{font-family:var(--cond);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.moist .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px}
.moist .n{font-size:11px;color:var(--muted);margin-top:1px}

/* sticky bottom bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bar-bg);
  border-top:1px solid var(--line2);backdrop-filter:blur(10px);
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));
}
.barin{max-width:1400px;margin:0 auto;display:flex;gap:14px;align-items:center;overflow-x:auto}
.bcell{flex:0 0 auto}
.bcell .k{font-family:var(--cond);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.bcell .v{font-family:var(--mono);font-size:16px;font-weight:600}
.bstat{margin-left:auto;flex:0 0 auto}

svg{display:block;width:100%;height:auto}
/* At "Fit" the schematic scales to the card so the page never needs a sideways scroll.
   The larger sizes scroll inside their own box, never the page. */
.schem{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.schem svg{min-width:0}
.zoomrow{display:flex;align-items:center;gap:6px;padding:0 4px 8px;font-family:var(--cond);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.zoomrow button{background:var(--panel2);border:1px solid var(--line2);color:var(--ink2);font-family:var(--cond);font-size:11.5px;padding:4px 10px;border-radius:5px;cursor:pointer}
.zoomrow button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);font-weight:700;border-color:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);padding-top:8px;font-family:var(--cond)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px}
.foot{max-width:1400px;margin:0 auto;padding:6px 16px 20px;font-size:11.5px;color:var(--muted)}

/* ---------- guided workflow: start choices, stepper, banners ---------- */
.startchoices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.startchoice{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:12px 13px;cursor:pointer;text-align:left;color:var(--ink);font-family:var(--body)}
.startchoice[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.startchoice h3{font-size:15.5px;margin-bottom:3px}
.startchoice p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}
.startchoice .go{font-family:var(--cond);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--cyan);margin-top:7px;display:block}
.steps{display:flex;gap:0;border:1px solid var(--line2);border-radius:9px;overflow:hidden;margin-bottom:12px;background:var(--panel)}
.steps button{flex:1;background:transparent;border:0;border-right:1px solid var(--line);color:var(--muted);font-family:var(--cond);font-size:13px;padding:9px 6px;cursor:pointer;letter-spacing:.02em}
.steps button:last-child{border-right:0}
.steps button[aria-current=step]{background:var(--brand);color:var(--on-brand);font-weight:700}
.steps button .sn{display:block;font-family:var(--mono);font-size:10px;opacity:.75}
.stepnav{display:flex;gap:10px;margin:2px 0 14px}
.stepnav button{flex:1;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:9px;font-family:var(--cond);font-size:13.5px;cursor:pointer}
.stepnav button.primary{background:var(--brand);color:var(--on-brand);font-weight:700;border-color:var(--brand)}
.banner{border:1px solid var(--warn);border-left:4px solid var(--warn);background:rgba(245,196,75,.08);border-radius:0 8px 8px 0;padding:9px 12px;font-size:13px;margin-bottom:12px}
.banner b{font-family:var(--cond)}
.banner .tag{font-family:var(--cond);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;border:1px solid currentColor;border-radius:20px;padding:1px 8px;margin-right:7px}
.assump{font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;line-height:1.5}
.occTable{width:100%;border-collapse:collapse;font-size:12.5px}
.occTable th{font-family:var(--cond);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:5px 4px;border-bottom:1px solid var(--line2)}
.occTable td{padding:4px;border-bottom:1px solid var(--rule)}
.occTable input[type=text]{width:100%;text-align:left;font-family:var(--body);font-size:12.5px}
.occTable input[type=number]{width:64px}
.occTable select{font-size:12px;max-width:150px}
.lead3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:12px}
.lead3>div{padding:11px 13px;border-right:1px solid var(--line)}
.lead3>div:last-child{border-right:0}
.lead3 .k{font-family:var(--cond);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lead3 .v{font-size:14.5px;font-weight:600;margin-top:3px;line-height:1.4}
.statline{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px}
.statline:last-child{border-bottom:0}
.st-ic{font-family:var(--mono);font-weight:700;font-size:12px;min-width:22px;text-align:center;border:1px solid currentColor;border-radius:5px;padding:1px 0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(max-width:700px){
  body{font-size:16px}
  .field label{flex:1 1 100%;font-size:14px}
  input[type=number],input[type=text],select{font-size:16px}
  .steps button{font-size:11.5px;padding:8px 3px}
}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;background:var(--panel);color:var(--ink);
  border:1px solid var(--line2);border-radius:8px;padding:9px 14px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}

@media print{
  :root{color-scheme:light}
  body{background:#fff;color:#000;padding:0}
  header.top,.bar,.card:not([open]) .cbody,.toast,.itog,.zoomrow{display:none}
  .card{break-inside:avoid;border-color:#999}
  .wrap{display:block;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/*CORE-START*/
const RD=287.055, RATIO=0.621945;
const W_MIN=1e-6;   // 0.001 g/kg — air at -50°C saturates at 0.02 g/kg, so the floor has to sit well under that
function psatPa(t){const T=t+273.15;
  if(t>=0){const C8=-5800.2206,C9=1.3914993,C10=-0.048640239,C11=4.1764768e-5,C12=-1.4452093e-8,C13=6.5459673;
    return Math.exp(C8/T+C9+C10*T+C11*T*T+C12*T*T*T+C13*Math.log(T));}
  const C1=-5674.5359,C2=6.3925247,C3=-0.009677843,C4=6.2215701e-7,C5=2.0747825e-9,C6=-9.484024e-13,C7=4.1635019;
  return Math.exp(C1/T+C2+C3*T+C4*T*T+C5*T*T*T+C6*Math.pow(T,4)+C7*Math.log(T));}
function Wsat(t,P){const pw=psatPa(t)/1000; if(pw>=P*0.999) return 10; return RATIO*pw/(P-pw);}
function WfromRH(t,rh,P){const pw=rh*psatPa(t)/1000; return RATIO*pw/(P-pw);}
function RHfromW(t,W,P){const pw=P*W/(RATIO+W), ps=psatPa(t)/1000; return pw/ps;}
function enth(t,W){return 1.006*t+W*(2501+1.86*t);}
function tFromH(h,W){return (h-2501*W)/(1.006+1.86*W);}
function dewpoint(W,P){const pw=P*Math.max(W,1e-7)/(RATIO+Math.max(W,1e-7));
  let lo=-80,hi=99; for(let i=0;i<70;i++){const m=(lo+hi)/2; if(psatPa(m)/1000<pw) lo=m; else hi=m;} return (lo+hi)/2;}
function wetbulb(t,W,P){let lo=-80,hi=t;

  const m_oa_s=oa_ls/1000/FAsh.v, mda_s=mda, m_ra_s=Math.max(0,mda_s-m_oa_s);
  const W_Es=(m_oa_s*FAsh.W+m_ra_s*W_r)/mda_s, h_Es=(m_oa_s*FAsh.h+m_ra_s*h_r)/mda_s;
  const Es=mixState(h_Es,W_Es,P).s;
  const qs_s=qs*S.shLoad/100;
  const ts_s=S.roomT-qs_s/(mda_s*(1.006+1.86*W_Es));
  const toff_s=ts_s-fanRiseFor(mda_s,W_Es);
  let W_off_s;
  if(toff_s>=Es.dp) W_off_s=Es.W;
  else{let tadp_s=Es.t-(Es.t-toff_s)/CF; tadp_s=Math.max(tadp_s,adpMin);
       W_off_s=Es.W-CF*(Es.W-Wsat(tadp_s,P));}
  const W_room_s=W_off_s+latKgh/3600/mda_s;
  const shRHroom=RHfromW(S.roomT,W_room_s,P)*100;

  /* Room-units + separate ventilation: indicative single-zone split so the same
     load is never counted twice. Room units recirculate only and take the room
     sensible + moisture; the ventilation unit brings the fresh air to the room
     state. Vent duties are steady-state enthalpy differences, not selections. */
  let vent=null;
  if(S.systemType==='roomvent'){
    const mVent=oa_ls/1000/FAs.v;
    const coolVent=Math.max(0,mVent*(FAs.h-h_r)), heatVent=Math.max(0,mVent*(h_r-FAs.h));
    const roomAir=Math.max(cand.sensible||0, isFinite(cand.latent)?cand.latent:0);
    vent={ventFlow:oa_ls,roomAir:roomAir,
      coolVent:coolVent,heatVent:heatVent,
      roomSens:qs,roomLat:ql,roomMoist:latKgh,
      note:'Indicative split for one zone only: room units take '+n(qs,1)+' kW + '+n(latKgh,1)+' kg/h; ventilation takes '+fu(oa_ls)+' of fresh air.'};
  }

  return {V,G,qs,ql,latKgh,WoffMin:R.WoffMin,occSens,occLat,room,OA,OW,SH,E,Es,Ew,off,supply,supplyReq,roomAct,
    flow,mda,oa_ls,cand,driver,latImposs,fanRise,wet,mode,govern,t_ADP,W_ADP,adpOK,adpMin,adpReq_T,adpReq_M,
    total,sens,lat,cond:cond*3600,condKgs:cond,frosting,frostKgs,drainKgs,frostKW,frostAcc,fogKgh:fogKgs*3600,
    reheat,oaLoad,chwFlow,lphwFlow,faceArea,rows,CF,
    fanRise,dxAbs,reheatElec,heatElec,hpAbs,elecTotal,amps,shortfall,reheatFree,adpMinSrc:coolBase,
    exh_ls,FAs,hrRatio:FA.ratio,hrSaved,fanKW,netCool,W_hi,W_lo,Wdeh,leakOut,roomPa,leakA,occSensKW:occSens,act:{n:OCC.label},
    ts_w:ts_w_cap,dtHeat,heatShort,humKgh,humkW,heater,preheatAdb,lphwHeatFlow,qNet,frostSuggest,frostDutyEff,frostAuto,frostFlow,
    shRHroom,W_room_s,leak_ls,press_ls,minach_ls,freshBase,vent,bathLatent,
    occLabel:R.occLabel,occScenario:R.occScenario,humidityMode:R.humidityMode,systemType:R.systemType,
    ach:flow/1000*3600/V, achFresh:oa_ls/1000*3600/V, oaPct:oa_ls/flow*100, dtSupply:S.roomT-supply.t,
    sfpCheck:S.fanMode==='sfp'?S.sfp:null};
}

<script>
/* ---------------- air volume units ----------------
   Everything is held internally in l/s. These helpers only change how a
   volumetric AIR flow is shown and typed in. Water flows (chilled water,
   LPHW), condensate and specific fan power are deliberately left alone. */
const AIRUNITS={
  lps:{n:'l/s',  long:'litres per second',        f:1,     d:0},
  m3s:{n:'m³/s', long:'cubic metres per second',  f:0.001, d:3},
  m3h:{n:'m³/h', long:'cubic metres per hour',    f:3.6,   d:0}
};
let AU='lps';
function auDef(){return AIRUNITS[AU]||AIRUNITS.lps;}
function auN(){return auDef().n;}
function toU(lps){return lps*auDef().f;}          // l/s -> displayed unit
function frU(v){return v/auDef().f;}              // displayed unit -> l/s
function fv(lps,extra){return n(toU(lps),auDef().d+(extra||0));}   // number only
function fu(lps,extra){return fv(lps,extra)+' '+auN();}            // number + unit
function fother(lps,extra){                        // the two units not selected
  return Object.keys(AIRUNITS).filter(k=>k!==AU)
   .map(k=>n(lps*AIRUNITS[k].f,AIRUNITS[k].d+(extra||0))+' '+AIRUNITS[k].n).join(' · ');
}
function auVal(lps){return String(+toU(lps).toFixed(4));}          // for input value=
function auStep(st){
  const s=st*auDef().f;
  if(!isFinite(s)||s<=0) return 'any';
  const e=Math.pow(10,Math.floor(Math.log10(s))), m=s/e;
  return String(+((m<1.5?1:m<3.5?2:m<7.5?5:10)*e).toPrecision(6));
}
function syncUnitButtons(){
  document.querySelectorAll('#unitsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.u===AU)));
}
function setAirUnit(u){
  if(!AIRUNITS[u]||u===AU) return;
  AU=u; syncUnitButtons(); buildInputs(); refresh();
}
/* Inline l/s ↔ m³/h toggle. Every one of these drives the same global unit, so flipping any of them
   flips the whole page — inputs, results, schematic and the bar — and nothing can be read in two units at once. */
function auTog(){
  return `<span class="itog" role="group" aria-label="Air volume unit">`+
    ['lps','m3h'].map(k=>`<button type="button" data-tu="${k}" aria-pressed="${AU===k}" onclick="setAirUnit('${k}')">${AIRUNITS[k].n}</button>`).join('')+`</span>`;
}

/* ---------------- water flow units ----------------
   Chilled water and LPHW volumetric flows. Kept separate from the air
   volume unit because water is only ever quoted in l/s or m³/h. Flows
   are calculated and stored internally in l/s; these helpers only change
   how they are shown. */
const WATERUNITS={
  lps:{n:'l/s',  f:1,   d:2},
  m3h:{n:'m³/h', f:3.6, d:2}
};
let WU='lps';
function wuDef(){return WATERUNITS[WU]||WATERUNITS.lps;}
function wuN(){return wuDef().n;}
function wv(lps){return n(lps*wuDef().f,wuDef().d);}   // number only
function wu(lps){return wv(lps)+' '+wuN();}            // number + unit
function syncWaterButtons(){
  document.querySelectorAll('#waterunitsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.wu===WU)));
}
function setWaterUnit(u){
  if(!WATERUNITS[u]||u===WU) return;
  WU=u; syncWaterButtons(); refresh();
}
function wuTog(){
  return `<span class="itog" role="group" aria-label="Water flow unit">`+
    ['lps','m3h'].map(k=>`<button type="button" aria-pressed="${WU===k}" onclick="setWaterUnit('${k}')">${WATERUNITS[k].n}</button>`).join('')+`</span>`;
}

/* ---------------- moisture removal units ----------------
   Condensate, frost and any other water taken out of the air. Held internally in
   kg/h (1 kg of water = 1 litre); shown in litres per hour or litres per second. */
const MOISTUNITS={
  lh:{n:'l/h', f:1,      d:2},
  ls:{n:'l/s', f:1/3600, d:4}
};
let MU='lh';
function muDef(){return MOISTUNITS[MU]||MOISTUNITS.lh;}
function muN(){return muDef().n;}
function mvv(kgh){const v=kgh*muDef().f; return n(v,Math.abs(v)>=100?muDef().d-1:muDef().d);}   // number only
function mu(kgh){return mvv(kgh)+' '+muN();}                                                       // number + unit
function muOther(kgh){const k=MU==='lh'?'ls':'lh', v=kgh*MOISTUNITS[k].f; return n(v,Math.abs(v)>=100?MOISTUNITS[k].d-1:MOISTUNITS[k].d)+' '+MOISTUNITS[k].n;}
function muBoth(kgh){return mu(kgh)+' · '+muOther(kgh);}
function syncMoistButtons(){
  document.querySelectorAll('#moistunitsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mu===MU)));
}
function setMoistUnit(u){
  if(!MOISTUNITS[u]||u===MU) return;
  MU=u; syncMoistButtons(); refresh();
}
function muTog(){
  return `<span class="itog" role="group" aria-label="Moisture unit">`+
    ['lh','ls'].map(k=>`<button type="button" aria-pressed="${MU===k}" onclick="setMoistUnit('${k}')">${MOISTUNITS[k].n}</button>`).join('')+`</span>`;
}

let FORCE_LIGHT=false;
function theme(){return document.documentElement.dataset.theme==='light'?'light':'dark';}
function pal(){return PAL[FORCE_LIGHT?'light':theme()];}
function applyTheme(t){
  document.documentElement.dataset.theme=t;

  const b=document.getElementById('themeBtn'); if(b){b.textContent=t==='light'?'☀':'☾'; b.title=t==='light'?'Switch to night colours':'Switch to day colours';}
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=t==='light'?'#EEF2F7':'#08131F';

const PRESET={bham:{osDB:27.5,osRH:58,owDB:-4.5,owRH:90},lon:{osDB:29,osRH:56,owDB:-3,owRH:90},

let S={};
SEC.forEach(sec=>sec.f.forEach(f=>S[f.k]=f.v));
/* Guided-workflow state. STAGE walks Room → Loads → System → Results without ever
   clearing S, so moving backwards loses nothing. occGroups is seeded from the old
   single occupancy figure so saved projects keep their numbers. */
let STAGE='room';
const STAGES=[['room','Room'],['loads','Loads'],['system','System'],['results','Results']];
function seedGroups(){
  if(!Array.isArray(S.occGroups)||!S.occGroups.length){
    S.occGroups=[{name:'Occupants',n:S.occ||0,act:S.occAct||'light',scen:'Main'}];
    if(!S.occScenario) S.occScenario='Main';
  }
}
seedGroups();
function migrateState(d){
  /* Saved projects from earlier schemas: keep every number, map renamed keys. */
  if(d.rhMode&&!d.humidityMode) d.humidityMode=d.rhMode==='setpoint'?'close':'band';
  if(d.humCloseTol===undefined) d.humCloseTol=3;
  if(d.peopleInTotal===undefined) d.peopleInTotal='yes';
  if(d.occMode===undefined) d.occMode='groups';
  if(d.occScenario===undefined) d.occScenario='Main';
  if(d.systemType===undefined) d.systemType='mixed';
  if(d.confirmedLocation===undefined) d.confirmedLocation='no';
  if(d.capCheck===undefined) d.capCheck='no';
  if(d.projectKind===undefined) d.projectKind='example';
  if(d.bathArea===undefined) d.bathArea=0;
  if(d.bathTemp===undefined) d.bathTemp=30;
  if(d.bathUse===undefined) d.bathUse='still';
  if(d.frostProv===undefined) d.frostProv=(d.confirmedFrost==='yes')?'strategy':'none';
  if(d.frostDuty===undefined) d.frostDuty=0;
  if(d.frostSrc===undefined) d.frostSrc='lphw';
  if(d.frostNote===undefined) d.frostNote=(d.confirmedFrost==='yes')?'Carried over: frost protection was recorded as provided. Describe the strategy here.':'';
  if(d.coilPreset===undefined){
    let best='custom',bd=99;
    for(const k in COILPRESETS){const dd=Math.abs((d.CF||0.9)-COILPRESETS[k].cf); if(dd<bd&&k!=='custom'){bd=dd;best=k;}}
    d.coilPreset=bd<0.015?best:'custom';
  }
  return d;
}
/* One-line summary of the specialist assumptions currently in force. */
function advSummary(){
  const bits=[`contact factor ${n(S.CF,2)}`,
    S.coolSrc==='dx'?`evaporating ${n(S.evapT,1)}°C + ${n(S.dxApproach,1)} K approach`:`${n(S.chwF,1)}/${n(S.chwR,1)}°C water + ${n(S.approach,1)} K approach`,
    S.glycol>0?n(S.glycol,0)+'% glycol':'no glycol',
    S.fanMode==='sfp'?`fan ${n(S.sfp,2)} W/l/s ${S.motorInAir?'plug fan':'belt drive'}`:S.fanMode==='kw'?`fan ${n(S.fanHeatKW,2)} kW stated`:`fan +${n(S.fanK,2)} K`,
    `airflow rated at ${S.flowRef==='return'?'return density':'supply condition'}`,
    `${n(S.pressure,2)} kPa site pressure`];
  bits.push(`coil ${(COILPRESETS[S.coilPreset]||COILPRESETS.custom).short}`);
  if((S.bathArea||0)>0) bits.push(`bath +${n(bathEvap(S),1)} kg/h`);
  return bits.join(' · ');
}

/* ---------------- rendering ---------------- */
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function n(x,d=1){if(!isFinite(x))return '—';const v=Math.round(x*10**d)/10**d;return v.toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});}

function hintText(f){return typeof f.h==='function'?f.h(S):f.h;}
function applyVisibility(){
  SEC.forEach(sec=>sec.f.forEach(f=>{
    const el=document.querySelector('.fw[data-k="'+f.k+'"]');
    if(el) el.style.display=(f.show&&!f.show(S))?'none':'';
    if(el&&typeof f.h==='function'){const hh=el.querySelector('.hint'); if(hh) hh.innerHTML=hintText(f);}
  }));
}
let MODE='design';

  if(m==='design'&&!STAGE) STAGE='room';
  document.querySelectorAll('#modesw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));
  buildInputs(); refresh(); window.scrollTo({top:0,behavior:'smooth'});}

function startChoicesHTML(){
  const c=[['design','Design a system for a room','Size airflow, coils and heating for a room and its loads. Guided Room → Loads → System → Results.'],

    ['sense','Calculate air properties','An independent psychrometric calculator. Its inputs never feed the design or the site check.']];

    `<button type="button" class="startchoice" data-m="${x[0]}" aria-pressed="${MODE===x[0]}" onclick="setMode('${x[0]}')"><h3>${x[1]}</h3><p>${x[2]}</p><span class="go">${MODE===x[0]?'● current':'Choose →'}</span></button>`).join('')+`</div>`;
}

}
function occGroupsHTML(){
  seedGroups();
  const scenarios=[...new Set(S.occGroups.map(g=>(g.scen||'Main')||'Main'))];
  if(!scenarios.includes(S.occScenario||'Main')) S.occScenario=scenarios[0]||'Main';
  const o=occOf(S);
  let h=`<div class="field"><label>Groups in this room (one row per group)</label></div>
  <div class="tw"><table class="occTable" aria-label="Occupancy groups"><tr><th>Group</th><th>No.</th><th>Activity</th><th>Scenario</th><th></th></tr>`;
  S.occGroups.forEach((g,i)=>{
    h+=`<tr><td><input type="text" data-g="${i}" data-f="name" value="${esc(g.name||'')}" aria-label="Group ${i+1} name"></td>
    <td><input type="number" min="0" step="1" data-g="${i}" data-f="n" value="${g.n}" aria-label="Group ${i+1} number of people"></td>
    <td><select data-g="${i}" data-f="act" aria-label="Group ${i+1} activity">`+
      Object.keys(ACT).map(k=>`<option value="${k}" ${g.act===k?'selected':''}>${ACT[k].n}</option>`).join('')+`</select></td>
    <td><input type="text" data-g="${i}" data-f="scen" value="${esc(g.scen||'Main')}" aria-label="Group ${i+1} scenario"></td>
    <td><button type="button" class="tbtn" data-del="${i}" aria-label="Remove group ${i+1}">✕</button></td></tr>`;
  });
  h+=`</table></div>
  <div class="hint">Only groups tagged <b>${esc(S.occScenario||'Main')}</b> count towards the peak: <b>${n(o.n,0)} people · ${n(o.sens,2)} kW sensible · ${n(o.lat,2)} kg/h moisture.</b>
  Other scenarios (${scenarios.filter(s=>s!==(S.occScenario||'Main')).map(esc).join(', ')||'none'}) are alternative shifts and are never added in. One room, one zone — separate rooms need separate runs.</div>
  <div class="field"><label>&nbsp;</label><button type="button" class="tbtn" id="addGroup">+ Add group</button></div>`;
  return h;

function fieldHTML(f){
  if(f.grp){
    return `<div class="grphead"><b>${f.grp}</b>${f.sub?`<span>${f.sub}</span>`:''}</div>`;

  } else if(f.sel){

  } else if(f.au){
    return `<div class="field"><label for="in-${f.k}">${f.l}</label><input id="in-${f.k}" type="number" step="${auStep(f.st)}" data-k="${f.k}" data-au="1" value="${auVal(S[f.k])}" aria-describedby="h-${f.k}">`+
       (AU==='m3s'?`<span class="u">${auN()}</span>`:'')+auTog()+`</div>`;
  } else if(f.txt){
    return `<div class="field"><label for="in-${f.k}">${f.l}</label><input id="in-${f.k}" type="text" style="width:100%;text-align:left" data-k="${f.k}" value="${esc(S[f.k]||'')}" aria-describedby="h-${f.k}"></div>`;
  } else {
    const lim=(f.mn!==undefined?` min="${f.mn}"`:'')+(f.mx!==undefined?` max="${f.mx}"`:'');
    return `<div class="field"><label for="in-${f.k}">${f.l}</label><input id="in-${f.k}" type="number" step="${f.st}"${lim} data-k="${f.k}" value="${S[f.k]}" aria-describedby="h-${f.k}"><span class="u">${f.u||''}</span></div>`;
  }
}
function buildInputs(){
  const el=document.getElementById('leftcol'); let h='';
  const wasOpen={}; el.querySelectorAll('details.card').forEach(dd=>wasOpen[dd.dataset.sec]=dd.open);
  h+=startChoicesHTML();
  if(MODE==='design'){
    h+=stepperHTML();
    if(S.projectKind==='example') h+=`<div class="banner"><span class="tag">Example</span><b>Example project.</b> Illustrative inputs with unconfirmed assumptions — results are not assessed. Make it your own under Stage 1, then confirm the weather.</div>`;
    const secs=SEC.filter(s=>s.mode==='design'&&(!s.show||s.show(S))&&(s.stage===STAGE||(STAGE==='results'&&false)));
    if(STAGE==='results'){
      h+=`<div class="card"><div class="cbody"><b>Results live on the right</b> — below on phones and tablets — and follow every input. Move back to any stage to edit; nothing is lost.<div class="stepnav"><button type="button" onclick="setStage('system')">← Back to System</button></div></div></div>`;
    }
    secs.forEach((sec,i)=>{
      const op=(sec.id in wasOpen)?wasOpen[sec.id]:true;
      h+=`<details class="card" data-sec="${sec.id}" ${op?'open':''}><summary><span class="step">${sec.badge}</span><h2>${sec.n}</h2><span class="sub">${sec.s}</span></summary><div class="cbody">`;
      if(sec.id==='loads'&&S.occMode==='groups') h+=occGroupsHTML();
      if(sec.id==='plant') h+=`<div class="assump"><b>Working assumptions:</b> ${esc(advSummary())}</div>`;
      const vis=sec.f.filter(f=>!(f.show&&!f.show(S)));
      let alt=0;
      vis.forEach(f=>{
        if(f.grp){h+=fieldHTML(f); return;}
        const dep=f.show?` dep`:'', why=f.show&&f.why?`<div class="why">↳ ${f.why}</div>`:'';
        h+=`<div class="fw${alt%2?' alt':''}${dep}" data-k="${f.k}">`+why+fieldHTML(f)+(f.h?`<div class="hint" id="h-${f.k}">${hintText(f)}</div>`:'')+`</div>`; alt++;
      });
      h+=`</div></details>`;
    });
    const idx=STAGES.findIndex(s=>s[0]===STAGE);
    h+=`<div class="stepnav">`+
      (idx>0?`<button type="button" onclick="setStage('${STAGES[idx-1][0]}')">← ${STAGES[idx-1][1]}</button>`:'')+
      (idx<3?`<button type="button" class="primary" onclick="setStage('${STAGES[idx+1][0]}')">${STAGES[idx+1][1]} →</button>`:'')+`</div>`;
  } else if(MODE==='site'){
    h+=`<div class="card"><div class="cbody"><b>Two different checks — pick the right one.</b><div class="stepnav">`+
      `<button type="button" onclick="gotoSelection()">Manufacturer’s selection (rated data)</button>`+
      `<button type="button" class="primary" onclick="void 0">Measured site performance ●</button></div>`+
      `<div class="hint">Rated selection compares nameplate duties and airflow against what the room needs. Measured performance works the room load back from your temperature, humidity and airflow readings. The calculator below is the measured side.</div></div></div>`;
    SEC.filter(s=>s.mode==='site').forEach((sec)=>{
      const op=(sec.id in wasOpen)?wasOpen[sec.id]:true;
      h+=`<details class="card${sec.id==='survey'?' svcard':''}" data-sec="${sec.id}" ${op?'open':''}><summary><span class="step">${sec.badge}</span><h2>${sec.n}</h2><span class="sub">${sec.s}</span></summary><div class="cbody">`;
      sec.f.forEach(f=>{
        if(f.grp){h+=fieldHTML(f); return;}
        const hide=f.show&&!f.show(S)?'style="display:none"':'';
        const dep=f.show?` dep`:'', why=(f.show&&!hide&&f.why)?`<div class="why">↳ ${f.why}</div>`:'';
        h+=`<div class="fw${dep}" data-k="${f.k}" ${hide}>`+why+fieldHTML(f)+(f.h?`<div class="hint" id="h-${f.k}">${hintText(f)}</div>`:'')+`</div>`;});
      h+=`</div></details>`;
    });
  } else {
    h+=`<div class="card"><div class="cbody"><b>Calculate air properties</b> — formerly “Sense check”. Drag the sliders; nothing here touches the design or the site check.<div class="rowhead" style="padding-top:8px"><span class="k">Units</span><span class="unitlbl">Air volume</span>${auTog()}<span class="unitlbl" style="margin-left:8px">Moisture</span>${muTog()}</div></div></div>`;
    SEC.filter(s=>s.mode==='sense').forEach((sec)=>{
      h+=`<details class="card" data-sec="${sec.id}" open><summary><span class="step">${sec.badge}</span><h2>${sec.n}</h2><span class="sub">${sec.s}</span></summary><div class="cbody">`;
      h+=senseWidget()+`</div></details>`;
    });
  }
  el.innerHTML=h;
  if(MODE==='sense') bindSense();
  bindInputEvents(el,wasOpen);
}
function bindInputEvents(el,wasOpen){
  el.querySelectorAll('input[type=number][data-k]').forEach(i=>{
    i.addEventListener('input',e=>{const raw=parseFloat(e.target.value)||0;
      S[e.target.dataset.k]=e.target.dataset.au?frU(raw):raw; applyVisibility(); refresh();});
    i.addEventListener('wheel',()=>{if(document.activeElement===i) i.blur();},{passive:true});
    i.setAttribute('inputmode','decimal');
  });
  el.querySelectorAll('input[type=text][data-k]').forEach(i=>{
    i.addEventListener('input',e=>{S[e.target.dataset.k]=e.target.value; refresh();});
  });
  el.querySelectorAll('select[data-k]').forEach(i=>i.addEventListener('change',e=>{
    const k=e.target.dataset.k; S[k]=e.target.value;
    if(k==='sitePreset'&&PRESET[e.target.value]){
      Object.assign(S,PRESET[e.target.value]);
      Object.keys(PRESET[e.target.value]).forEach(kk=>{
        const inp=el.querySelector('input[data-k="'+kk+'"]'); if(inp) inp.value=inp.dataset.au?auVal(S[kk]):S[kk];});
    }
    if(k==='coilPreset'&&COILPRESETS[e.target.value]&&e.target.value!=='custom'){
      S.CF=COILPRESETS[e.target.value].cf;
    }
    refresh(); buildInputs();}));
  el.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',e=>{
    const btn=e.currentTarget, k=btn.dataset.k, v=btn.dataset.v;
    S[k]=(k==='motorInAir')?parseInt(v):v;
    refresh(); buildInputs();}));
  el.querySelectorAll('.startchoice').forEach(b=>b.addEventListener('click',()=>{}));
  const ag=document.getElementById('addGroup');
  if(ag) ag.addEventListener('click',()=>{seedGroups(); S.occGroups.push({name:'Group '+(S.occGroups.length+1),n:0,act:'light',scen:S.occScenario||'Main'}); buildInputs(); refresh();});
  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    S.occGroups.splice(parseInt(b.dataset.del),1); if(!S.occGroups.length) seedGroups(); buildInputs(); refresh();}));
  el.querySelectorAll('input[data-g]').forEach(i=>{
    i.addEventListener('input',e=>{
      const gi=parseInt(e.target.dataset.g), f=e.target.dataset.f;
      seedGroups(); if(!S.occGroups[gi]) return;
      S.occGroups[gi][f]=(f==='n')?Math.max(0,parseFloat(e.target.value)||0):e.target.value;
      refresh(); buildInputsLight();
    });
    i.addEventListener('change',()=>{buildInputs(); refresh();});
  });
  el.querySelectorAll('select[data-g]').forEach(i=>{
    i.addEventListener('change',e=>{
      const gi=parseInt(e.target.dataset.g), f=e.target.dataset.f;
      seedGroups(); if(!S.occGroups[gi]) return;
      S.occGroups[gi][f]=e.target.value;
      refresh(); buildInputsLight();
    });
  });
  const osc=el.querySelector('input[data-k="occScenario"]');
  if(osc) osc.addEventListener('change',()=>{buildInputs(); refresh();});
  /* Typing your own contact factor overrides the coil choice above. */
  const cfi=el.querySelector('input[data-k="CF"]');
  if(cfi) cfi.addEventListener('change',()=>{S.coilPreset='custom'; buildInputs(); refresh();});
  /* Bath temperature/activity only exist when a bath area is entered — reveal on commit. */
  const bai=el.querySelector('input[data-k="bathArea"]');
  if(bai) bai.addEventListener('change',()=>{buildInputs(); refresh();});
}
function buildInputsLight(){
  /* Refresh group totals text without rebuilding (keeps focus while typing). */
  const o=occOf(S);
  document.querySelectorAll('#leftcol .hint').forEach(hh=>{
    if(hh.textContent.includes('count towards the peak'))
      hh.innerHTML=`Only groups tagged <b>${esc(S.occScenario||'Main')}</b> count towards the peak: <b>${n(o.n,0)} people · ${n(o.sens,2)} kW sensible · ${n(o.lat,2)} kg/h moisture.</b> Other scenarios are alternative shifts and are never added in. One room, one zone — separate rooms need separate runs.`;
  });
}

<script>
const DRV={sensible:['Sensible heat','the heat in the room and the coldest supply you will accept'],
 latent:['Moisture removal','how dry the supply air has to be to hold the room humidity'],
 fresh:['Fresh air','the ventilation rate for the people in the space'],
 pressure:['Extract make-up','replacing LEV extract and exhaust spill'],
 minach:['Minimum air change','the air change rate imposed on this type of space']};

let SCHZ=1;
function schemMinW(z){return z>1?(720*z)+'px':'0';}   // Fit = scale to the card; larger sizes scroll inside the card only
function zoomSchem(z){SCHZ=z;const s=document.querySelector('.schem svg');if(s)s.style.minWidth=schemMinW(z);
  document.querySelectorAll('.zoomrow button').forEach(b=>b.setAttribute('aria-pressed',parseFloat(b.dataset.z)===z));}
/* Airflow slider is logarithmic: 10 l/s up to 100 000 m³/h (27 778 l/s) on one track. */
const SF_MIN=10, SF_MAX=100000/3.6;
const sfPos=lps=>Math.round(1000*Math.log(Math.max(SF_MIN,Math.min(SF_MAX,lps))/SF_MIN)/Math.log(SF_MAX/SF_MIN));
const sfVal=pos=>SF_MIN*Math.pow(SF_MAX/SF_MIN,pos/1000);
function senseWidget(){
  return `<div id="senseBox">
   <div class="sl"><label>Dry bulb</label><input type="range" id="sT" min="-50" max="50" step="0.5" value="${SENSE.t}"><div class="rv" id="sTv">${SENSE.t.toFixed(1)} °C</div></div>
   <div class="sl"><label>Relative humidity</label><input type="range" id="sR" min="5" max="100" step="1" value="${SENSE.rh}"><div class="rv" id="sRv">${SENSE.rh} %</div></div>
   <div class="sl"><label>Cool it to</label><input type="range" id="sC" min="-50" max="50" step="0.5" value="${SENSE.c}"><div class="rv" id="sCv">${SENSE.c.toFixed(1)} °C</div></div>
   <div class="sl"><label>Airflow</label><input type="range" id="sF" min="0" max="1000" step="1" value="${sfPos(SENSE.f)}"><div class="rv" id="sFv">${fu(SENSE.f)}</div></div>
   <div class="hint">Drag the first two to set an air condition — anything from -50°C to +50°C. The third cools that same air and shows what happens to it; below 0°C the moisture comes out as frost rather than water. Airflow runs from 10 l/s to 100 000 m³/h. Nothing here touches the design or the site check.</div>
   <div class="rowhead" style="padding-top:10px"><span class="k">Airflow in</span>${auTog()}<span class="k" style="margin-left:8px">Moisture in</span>${muTog()}</div>
   <div class="senseg" id="sOut"></div></div>`;
}
const SENSE={t:22,rh:50,c:12,f:1000};
function bindSense(){
  ['sT','sR','sC','sF'].forEach(id=>{const e=document.getElementById(id); if(!e)return;
    e.addEventListener('input',()=>{SENSE.t=parseFloat(document.getElementById('sT').value);
      SENSE.rh=parseFloat(document.getElementById('sR').value);
      SENSE.c=parseFloat(document.getElementById('sC').value);
      SENSE.f=sfVal(parseFloat(document.getElementById('sF').value)); drawSense();});});
  drawSense();
}
function senseCalc(){
  const P=S.pressure, a=st(SENSE.t,WfromRH(SENSE.t,SENSE.rh/100,P),P);
  const cooled=SENSE.c<a.dp;
  const W2=cooled?Wsat(SENSE.c,P):a.W;
  const b=st(SENSE.c,Math.min(W2,Wsat(SENSE.c,P)),P);
  const drop=Math.max(0,(a.W-b.W)*1000);
  const mda=SENSE.f/1000/a.v;
  const condKgs=Math.max(0,mda*(a.W-b.W));
  const frosting=cooled&&SENSE.c<0&&condKgs>0;
  const frostKW=frosting?condKgs*frostKWperKgs(SENSE.c):0;
  const drainKW=frosting?0:condKgs*4.186*Math.max(SENSE.c,0);
  const kW=Math.max(0,mda*(a.h-b.h)+frostKW-drainKW);
  const sensKW=Math.min(kW,Math.max(0,mda*(1.006+1.86*b.W)*(a.t-b.t)));
  return {a,b,cooled,drop,dh:a.h-b.h,mda,frosting,frostKW,
    waterKgh:condKgs*3600, frostKgh:frosting?condKgs*3600:0, drainKgh:frosting?0:condKgs*3600,
    kW, sensKW, latKW:Math.max(0,kW-sensKW), frostAcc:frostAccum(frosting?condKgs:0,SENSE.c,8)};
}
function drawSense(){
  const Q=senseCalc(), {a,b,cooled,drop,dh,mda,waterKgh,kW,sensKW,latKW,frosting}=Q;
  const g=document.getElementById('sOut'); if(!g) return;
  document.getElementById('sTv').textContent=SENSE.t.toFixed(1)+' °C';
  document.getElementById('sRv').textContent=SENSE.rh+' %';
  document.getElementById('sCv').textContent=SENSE.c.toFixed(1)+' °C';
  document.getElementById('sFv').textContent=fu(SENSE.f);
  g.innerHTML=
   `<div><div class="k">Moisture</div><div class="v">${n(a.W*1000,2)}</div><div class="k">g/kg dry air</div></div>
    <div><div class="k">${a.dp<0?'Frost point':'Dew point'}</div><div class="v">${n(a.dp,1)}</div><div class="k">°C</div></div>
    <div><div class="k">Wet bulb</div><div class="v">${n(a.wb,1)}</div><div class="k">°C</div></div>
    <div><div class="k">Enthalpy</div><div class="v">${n(a.h,1)}</div><div class="k">kJ/kg</div></div>
    <div><div class="k">Density</div><div class="v">${n(1/a.v,3)}</div><div class="k">kg/m³</div></div>
    <div><div class="k">Air mass flow</div><div class="v">${n(mda,3)}</div><div class="k">kg/s · ${n(mda*3600,0)} kg/h · ${fother(SENSE.f)}</div></div>
    <div><div class="k">Cooled to ${n(SENSE.c,1)}°C</div><div class="v ${cooled?'':'mut'}">${n(b.rh*100,0)}%</div><div class="k">${cooled?(frosting?'saturated — moisture freezes on the surface':'saturated — water drops out'):'no condensation'}</div></div>
    <div><div class="k">Moisture removed</div><div class="v ${drop>0?'':'mut'}">${n(drop,2)}</div><div class="k">g/kg dry air</div></div>
    <div class="${frosting?'':''}"><div class="k">${frosting?'Held as frost':'Water to drain'}</div><div class="v ${drop>0?(frosting?'frostc':''):'mut'}">${mvv(waterKgh)}</div><div class="k">${muN()} · ${muOther(waterKgh)}${frosting?' · ice at '+n(SENSE.c,1)+'°C':''}</div></div>
    ${frosting?`<div><div class="k">Frost after 8 h</div><div class="v frostc">${n(Q.frostAcc.massKg,1)}</div><div class="k">kg · ${n(Q.frostAcc.defrostKWh,2)} kWh to defrost</div></div>`:''}
    <div><div class="k">Cooling duty</div><div class="v">${n(kW,2)}</div><div class="k">kW at ${fu(SENSE.f)}${frosting?' · incl. '+n(Q.frostKW,2)+' kW frost':''}</div></div>
    <div><div class="k">Sensible / latent</div><div class="v">${n(sensKW,1)}/${n(latKW,1)}</div><div class="k">kW · ${n(dh,1)} kJ/kg</div></div>`;
  const c=document.getElementById('senseChart'); if(c) c.innerHTML=senseChart(a,b,cooled);
}
/* ---- psychrometric chart scaffolding shared by the three charts.
   The axes grow to take in whatever is being plotted, so a -50°C freezer or a 35°C/60% day both sit on the paper. */
const FM='IBM Plex Mono, ui-monospace, Menlo, monospace', FC='IBM Plex Sans Condensed, IBM Plex Sans, system-ui, sans-serif';
function chartRange(states,tA0,tB0,wB0){
  const ts=states.map(s=>s.t).filter(isFinite), ws=states.map(s=>s.W*1000).filter(isFinite);
  let tA=Math.min(tA0,Math.floor((Math.min(...ts)-3)/5)*5), tB=Math.max(tB0,Math.ceil((Math.max(...ts)+3)/5)*5);
  tA=Math.max(-60,tA); tB=Math.min(60,tB);
  const wB=Math.min(60,Math.max(wB0,Math.ceil((Math.max(...ws)*1.08)/4)*4));
  const tStep=(tB-tA)>70?10:5, wStep=wB>36?8:4;
  return {tA,tB,wB,tStep,wStep};
}
function psyGrid(X0,X1,Y0,Y1,r,P){
  const C=pal(), {tA,tB,wB,tStep,wStep}=r;
  const px=t=>X0+(t-tA)/(tB-tA)*(X1-X0), py=w=>Y0-w/wB*(Y0-Y1);
  let g='';
  for(let t=tA;t<=tB+1e-9;t+=tStep) g+=`<line x1="${px(t)}" y1="${Y0}" x2="${px(t)}" y2="${Y1}" stroke="${C.grid}"/><text x="${px(t)}" y="${Y0+15}" fill="${C.muted}" font-size="10" text-anchor="middle" font-family="${FM}">${t}</text>`;
  for(let w=0;w<=wB+1e-9;w+=wStep) g+=`<line x1="${X0}" y1="${py(w)}" x2="${X1}" y2="${py(w)}" stroke="${C.grid}"/><text x="${X0-7}" y="${py(w)+3}" fill="${C.muted}" font-size="10" text-anchor="end" font-family="${FM}">${w}</text>`;
  [1,.8,.6,.4,.2].forEach(rh=>{let d='';
    for(let t=tA;t<=tB;t+=0.5){const w=WfromRH(t,rh,P)*1000; if(w>wB)break; d+=(d?'L':'M')+px(t).toFixed(1)+' '+py(w).toFixed(1);}
    g+=`<path d="${d}" fill="none" stroke="${rh===1?C.brand:C.rhLine}" stroke-width="${rh===1?2:1}"/>`;
    if(rh<1){ // label each curve where it is still on the paper
      let tt=tB; while(tt>tA&&WfromRH(tt,rh,P)*1000>wB-1) tt-=1;
      tt=Math.min(tt,tA+(tB-tA)*(0.35+rh*0.55));
      const w=WfromRH(tt,rh,P)*1000; if(w<wB-1&&w>0.3) g+=`<text x="${px(tt)+3}" y="${py(w)-3}" fill="${C.rhLabel}" font-size="9" font-family="${FM}">${rh*100}%</text>`;}});
  if(tA<0) g+=`<line x1="${px(0)}" y1="${Y0}" x2="${px(0)}" y2="${Y1}" stroke="${C.cool}" stroke-dasharray="2 4" opacity=".7"/><text x="${px(0)+3}" y="${Y1+10}" fill="${C.cool}" font-size="9" font-family="${FC}" letter-spacing="1">FROST</text>`;
  g+=`<text x="${(X0+X1)/2}" y="${Y0+32}" fill="${C.muted}" font-size="10.5" text-anchor="middle" font-family="${FC}" letter-spacing="1">DRY BULB °C</text>`;
  g+=`<text x="14" y="${(Y0+Y1)/2}" fill="${C.muted}" font-size="10.5" text-anchor="middle" font-family="${FC}" letter-spacing="1" transform="rotate(-90 14 ${(Y0+Y1)/2})">MOISTURE g/kg</text>`;
  return {g,px,py,wB};
}
function senseChart(a,b,cooled){
  const C=pal(), P=S.pressure, X0=48,X1=590,Y0=280,Y1=18;
  const r=chartRange([a,b],-10,50,30), F=psyGrid(X0,X1,Y0,Y1,r,P), {px,py,wB}=F;
  let g=F.g;
  g+=`<line x1="${px(a.t)}" y1="${py(a.W*1000)}" x2="${px(b.t)}" y2="${py(b.W*1000)}" stroke="${C.amber}" stroke-width="1.8" stroke-dasharray="${cooled?'0':'4 3'}"/>`;
  g+=`<line x1="${px(a.dp)}" y1="${py(a.W*1000)}" x2="${px(a.t)}" y2="${py(a.W*1000)}" stroke="${C.cool}" stroke-width="1" stroke-dasharray="2 3"/>`;
  [[a,C.ink,'AIR'],[b,C.amber,'COOLED']].forEach(p=>{const x=px(p[0].t),y=py(Math.min(p[0].W*1000,wB));
    g+=`<circle cx="${x}" cy="${y}" r="5" fill="${p[1]}" stroke="${C.outline}" stroke-width="1.5"/><text x="${x+9}" y="${y-7}" fill="${p[1]}" font-size="11" font-weight="600" font-family="${FM}">${p[2]}</text>`;});
  return `<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
function senseNotes(){
  const {a,b,cooled,drop}=senseCalc();
  return `<details class="card" open><summary><span class="step">~</span><h2>Where that air sits</h2></summary><div class="cbody">
   <div id="senseChart">${senseChart(a,b,cooled)}</div>
   <div class="note">The blue dotted line runs left to the saturation curve — that is the dew point, the surface temperature at which this air starts giving up water. Cool it below that and it tracks down the saturation curve, shedding moisture as it goes. Cool it only to somewhere above the dew point and the moisture content does not change at all, however much the relative humidity climbs.</div>
  </div></details>
  <details class="card" open><summary><span class="step">~</span><h2>Two things worth remembering</h2></summary><div class="cbody">
   <div class="chk"><div class="ic ok">1</div><div class="tx"><b>Relative humidity on its own tells you very little</b><br><span class="mut">The same ${n(a.W*1000,2)} g/kg of moisture reads ${n(RHfromW(a.t-5,a.W,S.pressure)*100,0)}% at ${n(a.t-5,0)}°C and ${n(RHfromW(a.t+5,a.W,S.pressure)*100,0)}% at ${n(a.t+5,0)}°C. Moisture content is what actually moves in and out of a room; RH is just how that reads at the temperature you happen to be at.</span></div></div>
   <div class="chk"><div class="ic ok">2</div><div class="tx"><b>Nothing dries air until the surface is below the dew point</b><br><span class="mut">This air has a dew point of ${n(a.dp,1)}°C. A coil sitting anywhere above that removes heat only. ${cooled?`At ${n(SENSE.c,1)}°C it is taking ${n(drop,2)} g/kg out.`:`At ${n(SENSE.c,1)}°C it is not drying at all — it is only lowering the temperature, and the RH rises to ${n(b.rh*100,0)}% as a result.`}</span></div></div>
  </div></details>`;
}

function adpFrom(on,off,P){
  if(on.W-off.W<1e-5) return null;
  const m=(on.W-off.W)/Math.max(0.01,on.t-off.t);
  let lo=-30,hi=off.t;
  for(let i=0;i<70;i++){const t=(lo+hi)/2; const Wl=off.W-m*(off.t-t);
    if(Wl>Wsat(t,P)) lo=t; else hi=t;}
  return (lo+hi)/2;
}
function surveyCalc(){
  const P=S.pressure;
  const sup=st(S.svSupT,WfromRH(S.svSupT,Math.min(0.999,S.svSupRH/100),P),P);
  const ret=st(S.svRetT,WfromRH(S.svRetT,Math.min(0.999,S.svRetRH/100),P),P);
  const v=(S.svFlowRef==='return')?ret.v:sup.v;
  const mda=Math.max(0.001,S.svFlow)/1000/v;
  const total=mda*(ret.h-sup.h);
  const sens=mda*(1.006+1.86*sup.W)*(ret.t-sup.t);
  const lat=total-sens;
  const moist=mda*(ret.W-sup.W)*3600;
  const shr=Math.abs(total)>0.05?sens/total:1;
  const V=S.svArea*S.svHeight;
  const ach=V>0?S.svFlow/1000*3600/V:null;
  const achFresh=V>0&&S.svFresh>0?S.svFresh/1000*3600/V:null;
  const on=(S.svCoil==='on')?st(S.svOnT,WfromRH(S.svOnT,Math.min(0.999,S.svOnRH/100),P),P):ret;
  const fanRise=S.svFanKW>0?S.svFanKW/(mda*(1.006+1.86*sup.W)):0;
  const off=st(sup.t-fanRise,sup.W,P);
  const cond=Math.max(0,mda*(on.W-off.W));
  const adp=adpFrom(on,off,P), cf=adp!==null?(on.t-off.t)/Math.max(0.1,on.t-adp):null;
  const frosting=adp!==null&&adp<0&&cond>0;
  const frostKW=frosting?cond*frostKWperKgs(adp):0;
  const coilTot=Math.max(0,mda*(on.h-off.h)+frostKW-(frosting?0:cond*4.186*Math.max(off.t,0)));
  const coilSens=Math.min(coilTot,Math.max(0,mda*(1.006+1.86*on.W)*(on.t-off.t)));
  const coilLat=Math.max(0,coilTot-coilSens);
  return {sup,ret,on,off,mda,total,sens,lat,moist,shr,ach,achFresh,V,cond:cond*3600,condKgs:cond,frosting,frostKW,
    frostAcc:frostAccum(frosting?cond:0,adp||0,8),coilTot,coilSens,coilLat,adp,cf,fanRise,
    dTs:ret.t-sup.t,dW:(ret.W-sup.W)*1000,vol:mda*(S.svFlowRef==='return'?ret.v:sup.v)};
}
function surveyChecks(Q){
  const C=[],push=(lv,t,x)=>C.push({lv,t,x});
  if(S.svTargOn==='yes'){
    const okT=Math.abs(Q.ret.t-S.svTargT)<=S.svTargTol, okR=Math.abs(Q.ret.rh*100-S.svTargRH)<=S.svTargRHTol;
    push(okT&&okR?'ok':'bad',okT&&okR?'The room is inside its specification':'The room is outside its specification',
      `${n(Q.ret.t,1)}°C / ${n(Q.ret.rh*100,0)}% against ${n(S.svTargT,1)}°C ±${n(S.svTargTol,1)} and ${n(S.svTargRH,0)}% ±${n(S.svTargRHTol,0)}. `+
      (okT?'':`Temperature is ${n(Math.abs(Q.ret.t-S.svTargT),1)} K out. `)+(okR?'':`Humidity is ${n(Math.abs(Q.ret.rh*100-S.svTargRH),0)}% out.`));
  }
  if(Q.dTs<1) push('warn','Barely any temperature difference across the room',
    `${n(Q.dTs,1)} K between supply and return. Either there is almost no load, the plant is off or throttled right back, or supply air is short-circuiting into the return before it reaches the space.`);
  if(Q.dW<-0.02) push('warn','The return air is drier than the supply',
    `By ${n(-Q.dW,2)} g/kg. Something in the room is absorbing moisture, or one of the two humidity sensors is out. Check both against a calibrated instrument before you trust the latent figure.`);
  else if(Q.moist<0.05) push('ok','No measurable moisture gain in the room',
    'Supply and return sit at the same moisture content, so nothing in the space is adding water and the coil has no latent work to do.');
  else push('ok','Moisture is being added in the room',
    `${muBoth(Q.moist)}, worth ${n(Q.lat,2)} kW. At steady state the coil must remove the same amount, so you should see roughly ${mu(Q.moist)} ${Q.frosting?'building up as frost on the coil':'at the drain'}. If you do not, one of these readings is wrong.`);
  push('ok','Sensible heat ratio',
    `${n(Q.shr,2)} — ${Q.shr>0.98?'effectively all of the work is temperature, none is moisture':n((1-Q.shr)*100,0)+'% of the load is moisture removal'}.`);
  if(Q.sup.rh>0.97) push('warn','Supply humidity reading looks saturated',
    `${n(Q.sup.rh*100,0)}% RH. A sensor sitting in a wet supply stream reads high, and carryover off the coil does the same. Re-measure well downstream of the fan before relying on the latent split.`);
  if(Q.ach!==null&&Q.ach<2) push('warn','Low air change rate',`${n(Q.ach,1)} ac/h on ${n(Q.V,0)} m³.`);
  else if(Q.ach!==null) push('ok','Air change rate',`${n(Q.ach,1)} ac/h total on ${n(Q.V,0)} m³${Q.achFresh!==null?', of which '+n(Q.achFresh,2)+' ac/h is fresh air ('+fu(S.svFresh)+')':''}.`);
  if(Q.cf!==null) push('ok','Contact factor measured off the coil',
    `${n(Q.cf,2)} with an apparatus dew point of ${n(Q.adp,1)}°C. A conventional AHU coil runs about 0.82 on 4 rows and 0.93 on 6; inclined close-finned coils in close-control units run higher for the same rows. Compare it against whatever the unit was originally selected at — well below that usually means a fouled coil, blocked fins, or more air across it than it was built for.`);
  else push('ok','The coil is running dry',
    'No moisture coming off it, so there is no apparatus dew point to measure. If the room needs drying, this is why it is not getting it.');
  if(Q.frosting) push('warn','The coil surface is below freezing — this moisture is going on as frost',
    `An apparatus dew point of ${n(Q.adp,1)}°C means the ${muBoth(Q.cond)} the coil is taking out is being held on the fins as ice, not running to the drain. That is ${n(Q.frostAcc.massKg,1)} kg of frost in 8 hours and ${n(Q.frostKW,2)} kW extra on the coil to freeze it. Expect airflow to fall and the off-coil to drift as the block ices; the unit needs a working defrost.`);
  if(S.svFanKW<=0) push('warn','No fan heat entered',
    'The off-coil condition is being taken as the supply condition, so the coil duty below is understated by whatever the fan puts in. Put the fan heat in on the card to the left and it will correct itself.');
  push('ok','Coil duty from these readings',
    `${n(Q.coilTot,1)} kW total, ${n(Q.coilSens,1)} sensible and ${n(Q.coilLat,1)} latent${S.svCoil==='on'?'':'. On-coil is being taken as the return air, so this assumes full recirculation — if there is fresh air joining before the coil, measure the on-coil condition'}.`);
  return C;
}
function surveyChart(Q){
  const C=pal(), P=S.pressure, X0=52,X1=600,Y0=300,Y1=20;
  const r=chartRange([Q.on,Q.off,Q.sup,Q.ret],0,40,20), F=psyGrid(X0,X1,Y0,Y1,r,P), {px,py,wB}=F;
  let g=F.g;
  if(S.svTargOn==='yes'){
    const x1=px(S.svTargT-S.svTargTol),x2=px(S.svTargT+S.svTargTol);
    const w1=WfromRH(S.svTargT,Math.max(.02,(S.svTargRH-S.svTargRHTol)/100),P)*1000,w2=WfromRH(S.svTargT,Math.min(.98,(S.svTargRH+S.svTargRHTol)/100),P)*1000;
    g+=`<rect x="${x1}" y="${py(w2)}" width="${x2-x1}" height="${py(w1)-py(w2)}" fill="${C.tolBox}" stroke="${C.brand}" stroke-dasharray="3 3"/>`;
  }

  pts.forEach(p=>{const x=px(p[1].t),y=py(Math.min(p[1].W*1000,wB));

  return `<svg viewBox="0 0 620 344" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;

/* rows shared by the on-screen table and the PDF: [label, value, note] */
function surveyRows(Q){
  const rows=[
   ['Supply air mass flow',`${n(Q.mda,3)} kg/s`,`${n(Q.mda*3600,0)} kg/h dry air · ${fu(S.svFlow)} at ${S.svFlowRef==='return'?'return':'supply'} density`],
   ['Measured airflow',fu(S.svFlow),fother(S.svFlow)],
   ['Water carried IN with the supply air',mu(Q.mda*Q.sup.W*3600),`at ${n(Q.sup.W*1000,2)} g/kg`],
   ['Water carried OUT with the return air',mu(Q.mda*Q.ret.W*3600),`at ${n(Q.ret.W*1000,2)} g/kg`],
   ['Water added inside the room',mu(Q.moist),`${muOther(Q.moist)} — the difference: people, process, infiltration`],
   ['Sensible heat gain',`${n(Q.sens,2)} kW`,`${n(Q.dTs,1)} K rise`],
   ['Latent heat gain',`${n(Q.lat,2)} kW`,`${muBoth(Q.moist)} of water`],
   ['Total heat gain',`${n(Q.total,2)} kW`,`SHR ${n(Q.shr,2)}`]];
  if(Q.ach!==null) rows.push(['Air change rate — total',`${n(Q.ach,1)} ac/h`,`${fu(S.svFlow)} on ${n(Q.V,0)} m³`]);
  if(Q.achFresh!==null) rows.push(['Air change rate — fresh air',`${n(Q.achFresh,2)} ac/h`,`${fu(S.svFresh)} fresh · ${n(S.svFresh/Math.max(1,S.svFlow)*100,0)}% of supply`]);
  rows.push(['Coil duty (total / sens / lat)',`${n(Q.coilTot,1)} / ${n(Q.coilSens,1)} / ${n(Q.coilLat,1)} kW`,(S.svFanKW>0?'off-coil '+n(Q.off.t,1)+'°C':'fan heat not entered')+(Q.frosting?' · incl. '+n(Q.frostKW,2)+' kW to freeze the frost':'')]);
  rows.push([Q.frosting?'Frost building on the coil':'Condensate off the coil',mu(Q.cond),Q.frosting?`${muOther(Q.cond)} · held as ice at ${n(Q.adp,1)}°C · ${n(Q.frostAcc.massKg,1)} kg in 8 h`:`${muOther(Q.cond)} at the drain`]);
  rows.push(['Apparatus dew point / contact factor',Q.adp!==null?n(Q.adp,1)+'°C  ·  '+n(Q.cf,2):'dry coil','']);
  return rows;
}
function stateRows6(list){return list.map(p=>`<tr><td>${p[0]}</td><td>${n(p[1].t,1)}</td><td>${n(p[1].rh*100,0)}</td><td>${n(p[1].W*1000,2)}</td><td>${n(p[1].h,1)}</td><td>${n(p[1].dp,1)}</td><td>${n(p[1].wb,1)}</td></tr>`).join('');}
function surveyStates(Q){return [['On the coil'+(S.svCoil==='on'?'':' (= return)'),Q.on],['Off the coil (derived)',Q.off],['Supply into the room',Q.sup],['Return / the room',Q.ret]];}
